:root {
  /* Taza de porcelana con filo cobalto: tinta espresso sobre blanco frío; el ticket de barra es la pieza central. */
  --bg: #ECEEF2;
  --surface: #FFFFFF;
  --ink: #22170F;
  --muted: #646976;
  --line: #D5D9E1;
  --accent: #2443C4;
  --accent-ink: #FFFFFF;
  --accent-soft: #E2E7FA;
  --crema: #A8661F;
  --pos: #1D7548;
  --neg: #B2331D;
  --shadow: 0 -10px 30px rgb(20 24 40 / .12);
  --display: "Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  --ticket: "Doto Ticket", "IBM Plex Mono", ui-monospace, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13110F; --surface: #1F1B18; --ink: #F1EBE5; --muted: #A49D96; --line: #37322D;
    --accent: #8BA4FF; --accent-ink: #0D1433; --accent-soft: #232B4A;
    --crema: #E3A962; --pos: #62C893; --neg: #F27E68; --shadow: 0 -10px 30px rgb(0 0 0 / .45);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13110F; --surface: #1F1B18; --ink: #F1EBE5; --muted: #A49D96; --line: #37322D;
  --accent: #8BA4FF; --accent-ink: #0D1433; --accent-soft: #232B4A;
  --crema: #E3A962; --pos: #62C893; --neg: #F27E68; --shadow: 0 -10px 30px rgb(0 0 0 / .45);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 16px/1.45 var(--body);
  -webkit-font-smoothing: antialiased;
}
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: .45; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); }

.app { max-width: 560px; margin: 0 auto; padding: 20px 16px 40px; }

/* Cabecera */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.eyebrow { margin: 0; font: 500 12px/1.2 var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
h1 {
  margin: 6px 0 0; font-family: var(--display); font-weight: 800;
  font-size: clamp(32px, 9vw, 42px); line-height: .92; letter-spacing: -.03em; text-wrap: balance;
}
h1 span { color: var(--accent); }
.status {
  flex: none; font: 500 11px/1 var(--mono); text-transform: uppercase; letter-spacing: .05em;
  padding: 7px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted);
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--crema); }
.status.live::before { background: var(--pos); }

/* Pestañas */
.tabs {
  position: sticky; top: 8px; z-index: 5;
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px;
  margin: 18px 0 22px; padding: 4px; border-radius: 13px;
  background: var(--surface); border: 1px solid var(--line);
}
.tab {
  appearance: none; border: 0; background: transparent; border-radius: 9px;
  padding: 10px 2px; font-weight: 600; font-size: 14px; color: var(--muted);
}
.tab[aria-selected="true"] { background: var(--ink); color: var(--bg); }

/* Secciones */
section + section { margin-top: 26px; }
h2 {
  margin: 0 0 10px; display: flex; align-items: baseline; justify-content: space-between; gap: 8px;
  font: 600 12px/1.2 var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted);
}
h2 .link { font: 600 13px var(--body); letter-spacing: 0; text-transform: none; }
.link { appearance: none; border: 0; background: none; padding: 4px 0; color: var(--accent); font-weight: 600; font-size: 14px; }
.note { margin: 10px 0 0; font-size: 14px; color: var(--muted); max-width: 62ch; }

/* Quién paga */
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 6px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 15px; border-radius: 999px; border: 1.5px solid var(--line);
  background: var(--surface); font-weight: 600; font-size: 15px;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

<body>
<div class="app">
  <header class="top">

<script>
(function () {
  'use strict';

  /* ---------- Datos por defecto ---------- */
  var PRODUCTOS_INICIALES = [
    { name: 'Café solo', price: 1.30 },
    { name: 'Cortado', price: 1.40 },
    { name: 'Café con leche', price: 1.60 },
    { name: 'Americano', price: 1.50 },
    { name: 'Capuchino', price: 2.00 },
    { name: 'Descafeinado', price: 1.60 },
    { name: 'Té o infusión', price: 1.50 },
    { name: 'Cola Cao', price: 1.80 }
  ];

  /* ---------- Utilidades ---------- */
  var eur = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' });
  function money(c) { return eur.format((c || 0) / 100); }
  function signed(c) { return c === 0 ? money(0) : (c > 0 ? '+' : '−') + eur.format(Math.abs(c) / 100); }
  function cents(e) { return Math.round(Number(e) * 100) || 0; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
  function clean(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); }
  function sameName(a, b) { return clean(a).toLocaleLowerCase('es') === clean(b).toLocaleLowerCase('es'); }
  function byName(a, b) { return a.localeCompare(b, 'es', { sensitivity: 'base' }); }
  function parsePrice(v) {
    var n = parseFloat(String(v).replace(/[€\s]/g, '').replace(',', '.'));
    return isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : null;
  }
  function priceText(e) { return (Math.round(e * 100) / 100).toFixed(2).replace('.', ','); }
  function localDay(iso) { var d = new Date(iso); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  var fmtDay = new Intl.DateTimeFormat('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
  var fmtShortDay = new Intl.DateTimeFormat('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
  var fmtTime = new Intl.DateTimeFormat('es-ES', { hour: '2-digit', minute: '2-digit' });
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  /* ---------- Lógica de cuentas (en céntimos) ---------- */
  // Saldo > 0: ha adelantado más de lo que ha tomado (le deben). Saldo < 0: debe.
  function balances(data) {
    var b = new Map();
    function add(n, v) { b.set(n, (b.get(n) || 0) + v); }
    data.people.forEach(function (p) { b.set(p.name, 0); });
    data.rounds.forEach(function (r) {
      r.items.forEach(function (it) { var c = cents(it.price); add(r.payer, c); add(it.person, -c); });
    });
    data.payments.forEach(function (p) { var c = cents(p.amount); add(p.from, c); add(p.to, -c); });
    return b;
  }
  // Pagos mínimos para dejar a todos a cero (reparto voraz).
  function settle(bal) {
    var deb = [], cred = [];
    bal.forEach(function (v, n) { if (v < 0) deb.push({ n: n, v: -v }); else if (v > 0) cred.push({ n: n, v: v }); });
    function order(a, b) { return b.v - a.v || byName(a.n, b.n); }
    deb.sort(order); cred.sort(order);
    var out = [], i = 0, j = 0;
    while (i < deb.length && j < cred.length) {
      var x = Math.min(deb[i].v, cred[j].v);
      out.push({ from: deb[i].n, to: cred[j].n, amount: x });
      deb[i].v -= x; cred[j].v -= x;
      if (!deb[i].v) i++;
      if (!cred[j].v) j++;
    }
    return out;
  }
  function lastPaid(data) {
    var m = new Map();
    data.rounds.forEach(function (r) { if (!m.has(r.payer) || r.date > m.get(r.payer)) m.set(r.payer, r.date); });
    return m;
  }
  // Le toca a quien más debe; si empatan, a quien hace más que no paga.
  function suggestPayer(data, candidates, bal) {
    bal = bal || balances(data);
    var lp = lastPaid(data);
    var list = candidates.slice().sort(function (a, b) {
      return (bal.get(a) || 0) - (bal.get(b) || 0) ||
        String(lp.get(a) || '').localeCompare(String(lp.get(b) || '')) || byName(a, b);
    });
    return list[0] || null;
  }
  function groupCounts(names, productOrder) {
    var m = new Map();
    names.forEach(function (n) { m.set(n, (m.get(n) || 0) + 1); });
    var idx = function (n) { var i = productOrder.indexOf(n); return i < 0 ? 999 : i; };
    return Array.from(m.entries()).sort(function (a, b) { return idx(a[0]) - idx(b[0]) || byName(a[0], b[0]); });
  }

  window.__cafes = { balances: balances, settle: settle, suggestPayer: suggestPayer };

  /* ---------- Almacenamiento: Google Sheets o demo local ---------- */
  var isSheets = !!(window.google && google.script && google.script.run);

  function remote(fn) {
    return function () {
      var args = Array.prototype.slice.call(arguments);
      return new Promise(function (resolve, reject) {
        var r = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
        r[fn].apply(r, args);
      });
    };
  }

  // Demo: simula el inicio de sesión de Google con un correo ficticio y guarda todo en este navegador.
  function demoStore() {
    var KEY = 'ronda-cafes-demo-v2', ME = 'tu.correo@gmail.com';
    var data = null, fresh = false;
    try { var raw = localStorage.getItem(KEY); if (raw) data = JSON.parse(raw); } catch (e) { data = null; }
    if (!data || !data.people) { data = seedDemo(); fresh = true; }
    function persist() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* sin almacenamiento: queda en memoria */ } }
    function myName() { var p = data.people.find(function (x) { return x.email === ME; }); return p ? p.name : null; }
    function out(extra) {
      var d = JSON.parse(JSON.stringify(data));
      d.me = { email: ME, name: myName() };
      d.people = d.people.map(function (p) { return { name: p.name, active: p.active !== false, claimed: !!p.email }; });
      if (extra) d.lastId = extra;
      return Promise.resolve(d);
    }
    function fail(msg) { return Promise.reject(new Error(msg)); }
    function id() { return Math.random().toString(36).slice(2, 10); }
    function without(list, rid) { return list.filter(function (x) { return x.id !== rid; }); }
    function needMe() { return myName() ? null : fail('Antes de apuntar nada, elige tu nombre'); }
    return {
      demo: true,
      fresh: function () { return fresh; },
      load: function () { return out(); },
      register: function (name) {
        name = clean(name); if (!name) return fail('Escribe tu nombre');
        if (myName()) return out();
        var p = data.people.find(function (x) { return sameName(x.name, name); });
        if (p && p.email) return fail('«' + p.name + '» ya está unido a otra cuenta. Elige otro nombre.');
        if (p) { p.email = ME; p.active = true; } else data.people.push({ name: name, active: true, email: ME });
        persist(); return out();
      },
      rename: function (name) {
        name = clean(name); if (!name) return fail('Escribe tu nombre');
        var old = myName(); if (!old) return needMe(); if (old === name) return out();
        if (data.people.some(function (x) { return x.email !== ME && sameName(x.name, name); })) return fail('Ya hay alguien que se llama «' + name + '»');
        function sw(v) { return v === old ? name : v; }
        data.people.forEach(function (x) { if (x.email === ME) x.name = name; });
        data.rounds.forEach(function (r) { r.payer = sw(r.payer); r.by = sw(r.by); r.items.forEach(function (i) { i.person = sw(i.person); }); });
        data.payments.forEach(function (x) { x.from = sw(x.from); x.to = sw(x.to); x.by = sw(x.by); });
        persist(); return out();
      },
      switchUser: function () { data.people.forEach(function (x) { if (x.email === ME) delete x.email; }); persist(); return out(); },
      addRound: function (r) { var e = needMe(); if (e) return e; var n = id(); data.rounds.push({ id: n, date: new Date().toISOString(), payer: r.payer, by: myName(), items: r.items }); persist(); return out(n); },
      deleteRound: function (rid) { var e = needMe(); if (e) return e; data.rounds = without(data.rounds, rid); persist(); return out(); },
      addPayment: function (p) { var e = needMe(); if (e) return e; var n = id(); data.payments.push({ id: n, date: new Date().toISOString(), from: p.from, to: p.to, amount: p.amount, by: myName() }); persist(); return out(n); },
      deletePayment: function (rid) { var e = needMe(); if (e) return e; data.payments = without(data.payments, rid); persist(); return out(); },
      savePeople: function (list) {
        var e = needMe(); if (e) return e;
        var mail = {}; data.people.forEach(function (x) { if (x.email) mail[x.name.toLocaleLowerCase('es')] = x.email; });
        data.people = list.map(function (x) { var o = { name: x.name, active: x.active }; var m = mail[x.name.toLocaleLowerCase('es')]; if (m) o.email = m; return o; });
        persist(); return out();
      },
      saveProducts: function (list) { var e = needMe(); if (e) return e; data.products = list; persist(); return out(); },
      reset: function () { data = seedDemo(); persist(); return out(); }
    };
  }

  function seedDemo() {
    var people = ['Ana', 'Javi', 'Lucía', 'Marta', 'Pablo', 'Sergio'];
    var usual = { 'Ana': 'Cortado', 'Javi': 'Café con leche', 'Lucía': 'Americano', 'Marta': 'Café solo', 'Pablo': 'Capuchino', 'Sergio': 'Té o infusión' };
    var price = {}; PRODUCTOS_INICIALES.forEach(function (p) { price[p.name] = p.price; });
    var plan = [
      { back: 4, payer: 'Ana', who: ['Ana', 'Javi', 'Lucía', 'Marta', 'Pablo'] },
      { back: 3, payer: 'Javi', who: ['Ana', 'Javi', 'Lucía', 'Sergio'] },
      { back: 2, payer: 'Lucía', by: 'Ana', who: people },
      { back: 1, payer: 'Pablo', by: 'Javi', who: ['Ana', 'Javi', 'Marta', 'Pablo', 'Sergio'] }
    ];
    var rounds = [], d = new Date(), weekdays = [];
    while (weekdays.length < 4) {
      d = new Date(d.getFullYear(), d.getMonth(), d.getDate() - 1);
      if (d.getDay() !== 0 && d.getDay() !== 6) weekdays.push(d);
    }
    plan.forEach(function (p, i) {
      var day = weekdays[p.back - 1];
      var when = new Date(day.getFullYear(), day.getMonth(), day.getDate(), 10, 12 + i * 3);
      rounds.push({
        id: 'demo' + i, date: when.toISOString(), payer: p.payer, by: p.by || p.payer,
        items: p.who.map(function (w) { return { person: w, product: usual[w], price: price[usual[w]] }; })
      });
    });
    // En la demo, Ana y Javi ya han entrado con su cuenta; el resto los añadió alguien a mano.
    var withAccount = { 'Ana': 'ana@ejemplo.com', 'Javi': 'javi@ejemplo.com' };
    return {
      people: people.map(function (n) { var o = { name: n, active: true }; if (withAccount[n]) o.email = withAccount[n]; return o; }),
      products: PRODUCTOS_INICIALES.slice(),
      rounds: rounds, payments: []
    };
  }

  function loginError(msg) { var e = new Error(msg); e.code = 'login'; return e; }

  // Versión GitHub: la web llama al Apps Script con el token de Google de quien ha entrado.
  function apiStore(cfg) {
    var auth = googleAuth(cfg.googleClientId);
    function call(action, args) {
      var tok = auth.current();
      if (!tok) { state.needLogin = true; return Promise.reject(loginError('Entra con tu cuenta de Google')); }
      return fetch(cfg.apiUrl, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }, // así el navegador no hace consulta previa (CORS)
        body: JSON.stringify({ action: action, args: args, token: tok })
      }).catch(function () {
        throw new Error('No hay conexión con el servidor. Si estás en la wifi de la empresa, prueba con datos del móvil');
      }).then(function (r) {
        if (!r.ok) throw new Error('El servidor ha respondido con un error (' + r.status + ')');
        return r.json();
      }).then(function (res) {
        if (res && res.ok) return res.data;
        var err = new Error((res && res.error) || 'Error del servidor');
        err.code = res && res.code;
        if (err.code === 'login') { auth.signOut(); state.needLogin = true; }
        throw err;
      });
    }
    function action(name) { return function () { return call(name, Array.prototype.slice.call(arguments)); }; }
    return {
      demo: false, api: true, auth: auth,
      fresh: function () { return false; },
      load: action('cargarDatos'), register: action('registrarme'), rename: action('cambiarMiNombre'),
      addRound: action('guardarRonda'), deleteRound: action('borrarRonda'),
      addPayment: action('guardarPago'), deletePayment: action('borrarPago'),
      savePeople: action('guardarPersonas'), saveProducts: action('guardarProductos')
    };
  }

  // Inicio de sesión con Google (Google Identity Services). El token dura una hora.
  function googleAuth(clientId) {
    var KEY = 'ronda-cafes-sesion';
    var token = null, listeners = [], ready = null;
    function claims(t) {
      try {
        var b = t.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
        while (b.length % 4) b += '=';
        var bytes = Uint8Array.from(atob(b), function (c) { return c.charCodeAt(0); });
        return JSON.parse(new TextDecoder().decode(bytes));
      } catch (e) { return null; }
    }
    function valid(t) { var c = t && claims(t); return !!(c && c.exp * 1000 > Date.now() + 60000); }
    try { var saved = JSON.parse(localStorage.getItem(KEY) || 'null'); if (saved && valid(saved.t)) token = saved.t; } catch (e) { /* sin almacenamiento */ }
    function set(t) {
      token = t;
      try { localStorage.setItem(KEY, JSON.stringify({ t: t })); } catch (e) { /* sin almacenamiento */ }
      listeners.forEach(function (fn) { fn(); });
    }
    function load() {
      if (ready) return ready;
      ready = new Promise(function (resolve, reject) {
        if (window.google && google.accounts && google.accounts.id) { resolve(); return; }
        var sc = document.createElement('script');
        sc.src = 'https://accounts.google.com/gsi/client'; sc.async = true;
        sc.onload = function () { resolve(); };
        sc.onerror = function () { ready = null; reject(new Error('No se ha podido cargar el inicio de sesión de Google. Revisa la conexión.')); };
        document.head.appendChild(sc);
      }).then(function () {
        google.accounts.id.initialize({
          client_id: clientId, auto_select: true, cancel_on_tap_outside: false, use_fedcm_for_prompt: true,
          callback: function (resp) { if (resp && resp.credential) set(resp.credential); }
        });
      });
      return ready;
    }
    return {
      current: function () { return valid(token) ? token : null; },
      onSignIn: function (fn) { listeners.push(fn); },
      renderButton: function (el) {
        return load().then(function () {
          if (!el.isConnected) return;
          google.accounts.id.renderButton(el, { type: 'standard', theme: 'outline', size: 'large', text: 'signin_with', shape: 'pill', locale: 'es', width: Math.min(320, el.clientWidth || 320) });
          google.accounts.id.prompt();
        });
      },
      signOut: function () {
        token = null;
        try { localStorage.removeItem(KEY); } catch (e) { /* sin almacenamiento */ }
        if (window.google && google.accounts && google.accounts.id) google.accounts.id.disableAutoSelect();
      }
    };
  }

  // Si junto a la página hay un config.js con la dirección del servidor, es la versión GitHub.
  function loadConfig() {
    return new Promise(function (resolve) {
      if (isSheets) { resolve(null); return; }
      if (window.CAFES_CONFIG) { resolve(window.CAFES_CONFIG); return; }
      var sc = document.createElement('script');
      sc.src = 'config.js';
      sc.onload = function () { resolve(window.CAFES_CONFIG || null); };
      sc.onerror = function () { resolve(null); };
      document.head.appendChild(sc);
    });
  }

  var store = null;

  /* ---------- Estado ---------- */
  var state = {
    data: null, bal: new Map(),
    tab: 'ronda', busy: false,
    round: { payer: null, items: new Map() },
    sheet: null, draft: null, draftDirty: false,
    toastTimer: null
  };
  var $ = function (id) { return document.getElementById(id); };

  function setData(d) {
    d = d || {};
    var me = d.me || {};
    var data = {
      me: { email: clean(me.email), name: me.name ? clean(me.name) : null, blocked: !!me.blocked },
      people: (d.people || []).filter(function (p) { return clean(p.name); }).map(function (p) { return { name: clean(p.name), active: p.active !== false, claimed: !!p.claimed }; }),
      products: (d.products || []).filter(function (p) { return clean(p.name); }).map(function (p) { return { name: clean(p.name), price: Number(p.price) || 0 }; }),
      rounds: (d.rounds || []).filter(function (r) { return r && r.items && r.items.length; }),
      payments: d.payments || [],
      sheetUrl: d.sheetUrl || '',
      appUrl: d.appUrl || ''
    };
    data.rounds.sort(function (a, b) { return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; });
    state.data = data;
    state.bal = balances(data);
  }
  // Antes de usar la app hay que saber quién eres.
  function gate() {
    if (store && store.api && state.needLogin) return 'login';
    if (!state.data) return null;
    if (!state.data.me.email) return 'sin-correo';
    if (state.data.me.blocked) return 'bloqueado';
    if (!state.data.me.name) return 'bienvenida';
    return null;
  }
  // Cambiar de cuenta: en GitHub cierra la sesión; en Apps Script lleva a la pantalla de Google.
  function switchAccountLink(label) {
    if (!store || store.demo) return '';
    if (store.api) return '<button class="link" type="button" data-act="logout">' + esc(label) + '</button>';
    var url = state.data && state.data.appUrl;
    if (!url) return '';
    return '<a href="https://accounts.google.com/AccountChooser?continue=' + encodeURIComponent(url) + '" target="_top" rel="noopener">' + esc(label) + '</a>';
  }
  function nameFromEmail(email) {
    var first = String(email || '').split('@')[0].split(/[._\-+0-9]/)[0];
    return first ? cap(first.toLowerCase()) : '';
  }
  function activeNames() { return state.data.people.filter(function (p) { return p.active; }).map(function (p) { return p.name; }); }
  function productOrder() { return state.data.products.map(function (p) { return p.name; }); }
  function productByName(n) { return state.data.products.find(function (p) { return sameName(p.name, n); }); }
  function roundPeople() { return Array.from(state.round.items.keys()); }
  function suggestion() {
    var c = roundPeople(); if (!c.length) c = activeNames();
    return suggestPayer(state.data, c, state.bal);
  }
  function currentPayer() { return state.round.payer || suggestion(); }
  function roundItems() {
    var out = [];
    state.round.items.forEach(function (list, person) { list.forEach(function (it) { out.push({ person: person, product: it.product, price: it.price }); }); });
    return out;
  }
  function hasHistory(name) {
    return state.data.rounds.some(function (r) { return r.payer === name || r.items.some(function (i) { return i.person === name; }); }) ||
      state.data.payments.some(function (p) { return p.from === name || p.to === name; });
  }

  /* ---------- Render ---------- */
  function render() {
    document.querySelectorAll('.tab').forEach(function (t) { t.setAttribute('aria-selected', String(t.dataset.tab === state.tab)); });
    $('main').setAttribute('aria-labelledby', 'tab-' + state.tab);
    var g = gate();
    if (!state.data && g !== 'login') return;
    renderStatus();
    document.body.classList.toggle('no-tabs', !!g);
    var html = g === 'login' ? viewLogin() : g === 'sin-correo' ? viewSinCorreo() : g === 'bloqueado' ? viewBloqueado() : g === 'bienvenida' ? viewBienvenida()
      : state.tab === 'ronda' ? viewRonda() : state.tab === 'cuentas' ? viewCuentas() : state.tab === 'historial' ? viewHistorial() : viewAjustes();
    // Lo que alguien está escribiendo no se pierde aunque lleguen datos nuevos mientras tanto.
    var kept = [];
    document.querySelectorAll('#main input[id]').forEach(function (inp) {
      var focused = document.activeElement === inp;
      if (focused || inp.value !== inp.defaultValue) kept.push({ id: inp.id, value: inp.value, focused: focused, s: inp.selectionStart, e: inp.selectionEnd });
    });
    $('main').innerHTML = html;
    kept.forEach(function (k) {
      var el = $(k.id); if (!el) return;
      el.value = k.value;
      if (k.focused) { el.focus({ preventScroll: true }); try { el.setSelectionRange(k.s, k.e); } catch (err) { /* algunos tipos no admiten selección */ } }
    });
    if (g === 'login') {
      var btn = $('gsi-button');
      if (btn) store.auth.renderButton(btn).catch(function (err) { var m = $('login-msg'); if (m) m.textContent = err.message; });
    }
    renderTicket();
    renderSheet();
  }

  function viewSinCorreo() {
    return '<div class="empty" style="margin-top:22px"><h3>Falta entrar con Google</h3>' +
      '<p>La app está publicada sin pedir cuenta de Google, así que no sabe quién eres y no puede apuntar nada a tu nombre.</p>' +

  function viewRonda() {
    var names = activeNames();
    if (!names.length) {
      return '<div class="empty"><h3>Primero, el equipo</h3><p>Añade a las personas que bajáis a por café. Solo hace falta el nombre.</p>' +
        '<button class="btn" data-act="tab" data-tab="ajustes">Añadir personas</button></div>';
    }
    var payer = currentPayer(), sug = suggestion();
    var chips = names.map(function (n) {
      return '<button class="chip" data-act="payer" data-name="' + esc(n) + '" aria-pressed="' + (n === payer) + '">' + esc(n) +
        (n === sug ? '<span class="tag">le toca</span>' : '') + '</button>';
    }).join('');
    var cards = names.map(function (n) {
      var count = (state.round.items.get(n) || []).length;
      return '<button class="person' + (count ? ' on' : '') + '" data-act="person" data-name="' + esc(n) + '" aria-label="' + (count ? 'Cambiar lo de ' : 'Añadir a ') + esc(n) + '">' +
        '<span class="name">' + esc(n) + '</span><span class="mark" aria-hidden="true">' + (count > 1 ? count : count ? '✓' : '+') + '</span></button>';
    }).join('');
    var tools = state.round.items.size
      ? '<button class="link" data-act="clear-round">Vaciar</button>'
      : (state.data.rounds.length ? '<button class="link" data-act="repeat-last">Repetir la última</button>' : '');
    return '<section><h2>Paga</h2><div class="chips" role="group" aria-label="Quién paga">' + chips + '</div></section>' +
      '<section><h2>Quién toma algo ' + tools + '</h2><div class="people">' + cards + '</div>' +
      '<p class="note">Toca a alguien para elegir qué toma. Para cambiarlo, toca su línea del ticket.</p></section>' +
      viewReceipt();
  }

  // El ticket: una línea por persona y producto, en el orden en que se añaden.
  function viewReceipt() {
    var items = roundItems(), order = productOrder(), now = new Date();
    var total = items.reduce(function (s, i) { return s + i.price; }, 0);
    var payer = currentPayer();
    var own = items.filter(function (i) { return i.person === payer; }).reduce(function (s, i) { return s + i.price; }, 0);
    var lines = [];
    state.round.items.forEach(function (list, person) {
      groupCounts(list.map(function (i) { return i.product; }), order).forEach(function (e) {
        var amt = list.filter(function (i) { return i.product === e[0]; }).reduce(function (s, i) { return s + i.price; }, 0);
        lines.push('<button class="r-line" data-act="person" data-name="' + esc(person) + '" aria-label="Cambiar lo de ' + esc(person) + '">' +
          '<span class="who">' + esc(person) + '</span><span class="what">' + (e[1] > 1 ? e[1] + '× ' : '') + esc(e[0]) + '</span>' +
          '<span class="amt">' + priceText(amt / 100) + '</span></button>');
      });
    });
    var counts = groupCounts(items.map(function (i) { return i.product; }), order);
    var orderTxt = counts.map(function (e) { return e[1] + '× ' + esc(e[0]); }).join(' · ');
    var n = items.length;
    var sub = !n ? 'Cada uno le deberá a quien paga lo que ha tomado.'
      : !payer ? 'Elige quién paga.'
      : 'Paga <b>' + esc(payer) + '</b>.' + (total - own > 0 ? ' Los demás le deberán ' + money(total - own) + '.' : '');
    return '<section class="receipt" aria-label="Ticket de la ronda">' +
      '<div class="r-head"><div class="r-title">Ronda de cafés</div><div class="r-meta">' + esc(cap(fmtShortDay.format(now))) + ' · ' + fmtTime.format(now) + '</div></div>' +
      '<hr class="r-sep">' +
      (n ? '<div class="r-cols" aria-hidden="true"><span>Quién</span><span>Qué</span><span>€</span></div>' + lines.join('')
         : '<p class="r-empty">Todavía no hay nada. Toca a quien quiera algo.</p>') +
      '<hr class="r-sep">' +
      '<div class="t-row"><span class="t-label">Total</span><span class="t-total">' + money(total) + '</span></div>' +
      (n ? '<div class="r-count">' + n + (n === 1 ? ' consumición' : ' consumiciones') + '</div>' +
           '<hr class="r-sep"><div class="t-label">Para pedir en la barra</div><div class="t-order">' + orderTxt + '</div>' : '') +
      '<div class="t-sub">' + sub + '</div>' +
      '<button class="btn block" data-act="save-round"' + (!n || !payer || state.busy ? ' disabled' : '') + '>' +
      (state.busy ? 'Apuntando…' : 'Apuntar ronda') + '</button></section>';
  }

  function renderTicket() { $('ticket').innerHTML = ''; }

  function viewCuentas() {
    var d = state.data, bal = state.bal, names = activeNames();
    if (!d.rounds.length && !d.payments.length) {
      return '<div class="empty"><h3>Aún no hay rondas</h3><p>Cuando apuntéis la primera, aquí veréis quién debe a quién y a quién le toca pagar.</p>' +
        '<button class="btn" data-act="tab" data-tab="ronda">Ir a la ronda</button></div>';
    }
    var next = names.length ? suggestPayer(d, names, bal) : null;
    var nb = next ? (bal.get(next) || 0) : 0;
    var why = nb < 0 ? 'Es quien más debe: ' + money(-nb) + '.' : 'Nadie debe nada. Le toca a quien hace más que no paga.';
    var shown = names.slice();
    bal.forEach(function (v, n) { if (v !== 0 && shown.indexOf(n) < 0) shown.push(n); });
    shown.sort(function (a, b) { return (bal.get(a) || 0) - (bal.get(b) || 0) || byName(a, b); });
    var max = 1; shown.forEach(function (n) { max = Math.max(max, Math.abs(bal.get(n) || 0)); });
    var rows = shown.map(function (n) {
      var v = bal.get(n) || 0, w = Math.round(Math.abs(v) / max * 50 * 10) / 10;
      var cls = v > 0 ? 'pos' : v < 0 ? 'neg' : '';
      var label = v > 0 ? 'le deben' : v < 0 ? 'debe' : 'en paz';
      return '<div class="bal"><span class="n">' + esc(n) + '</span>' +
        '<span class="bar" aria-hidden="true">' + (v ? '<span class="' + (v > 0 ? 'p' : 'm') + '" style="width:' + w + '%"></span>' : '') + '</span>' +
        '<span class="amt ' + cls + '">' + signed(v) + '<small>' + label + '</small></span></div>';
    }).join('');
    var xf = settle(bal);
    var xfers = xf.length ? xf.map(function (t) {
      return '<div class="xfer"><span class="what"><b>' + esc(t.from) + '</b> paga a <b>' + esc(t.to) + '</b></span>' +
        '<span class="amt">' + money(t.amount) + '</span>' +
        '<button class="btn ghost small" data-act="settle" data-from="' + esc(t.from) + '" data-to="' + esc(t.to) + '" data-amount="' + t.amount + '"' + (state.busy ? ' disabled' : '') + '>Hecho</button></div>';
    }).join('') : '<p class="note">Estáis todos a cero.</p>';
    return (next ? '<section class="hero"><div class="k">La próxima ronda la paga</div><div class="who">' + esc(next) + '</div><div class="why">' + why + '</div></section>' : '') +
      '<section><h2>Saldos</h2><div>' + rows + '</div>' +
      '<p class="note">Positivo: ha adelantado más de lo que ha tomado. Si paga siempre quien más debe, las cuentas se equilibran solas.</p></section>' +
      '<section><h2>Para quedar a cero</h2>' + xfers +
      (xf.length ? '<p class="note">Pulsa «Hecho» cuando alguien haga el Bizum o pague en efectivo.</p>' : '') + '</section>';
  }

  function viewHistorial() {
    var d = state.data, order = productOrder();
    var entries = d.rounds.map(function (r) { return { kind: 'r', date: r.date, r: r }; })
      .concat(d.payments.map(function (p) { return { kind: 'p', date: p.date, p: p }; }))
      .sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    if (!entries.length) return '<div class="empty"><h3>Sin movimientos</h3><p>Aquí aparecerá cada ronda que apuntéis y cada pago entre vosotros.</p></div>';
    var limited = entries.slice(0, 80);
    var today = localDay(new Date().toISOString());
    var yd = new Date(); yd.setDate(yd.getDate() - 1); var yesterday = localDay(yd.toISOString());
    var groups = [], cur = null;
    limited.forEach(function (e) {
      var k = localDay(e.date);
      if (!cur || cur.k !== k) { cur = { k: k, date: e.date, list: [] }; groups.push(cur); }
      cur.list.push(e);
    });
    var html = groups.map(function (g) {
      var label = g.k === today ? 'Hoy' : g.k === yesterday ? 'Ayer' : cap(fmtShortDay.format(new Date(g.date)));
      return '<section class="day"><h2>' + esc(label) + '</h2>' + g.list.map(function (e) {
        var t = fmtTime.format(new Date(e.date));
        if (e.kind === 'r') {
          var r = e.r, total = r.items.reduce(function (s, i) { return s + cents(i.price); }, 0);
          var n = r.items.length;
          var lis = r.items.map(function (i) { return '<li><span>' + esc(i.person) + ' · ' + esc(i.product) + '</span><span>' + money(cents(i.price)) + '</span></li>'; }).join('');
          return '<details class="entry"><summary><span class="time">' + t + '</span><span class="what"><b>' + esc(r.payer) + '</b> pagó <small>' + n + (n === 1 ? ' café' : ' cafés') + '</small>' +
            (r.by ? '<span class="by">Apuntó ' + esc(r.by === state.data.me.name ? 'tú' : r.by) + '</span>' : '') + '</span>' +
            '<span class="amt">' + money(total) + '</span></summary><ul class="items">' + lis + '</ul>' +
            '<button class="btn danger small del" data-act="del-round" data-id="' + esc(r.id) + '">Borrar esta ronda</button></details>';
        }
        var p = e.p;
        return '<details class="entry pay"><summary><span class="time">' + t + '</span><span class="what"><b>' + esc(p.from) + '</b> devolvió a <b>' + esc(p.to) + '</b>' +
          (p.by ? '<span class="by">Apuntó ' + esc(p.by === state.data.me.name ? 'tú' : p.by) + '</span>' : '') + '</span>' +
          '<span class="amt">' + money(cents(p.amount)) + '</span></summary>' +
          '<button class="btn danger small del" data-act="del-payment" data-id="' + esc(p.id) + '">Borrar este pago</button></details>';
      }).join('') + '</section>';
    }).join('');
    if (entries.length > limited.length) html += '<p class="note">Se muestran los últimos ' + limited.length + ' movimientos. El resto está en la hoja de cálculo.</p>';
    return html;
  }

      }).join('') + '</div>' : '');
    var products = '<div class="rows">' + state.draft.map(function (p, i) {

        '<input class="field price" id="pp-' + i + '" data-draft="price" data-idx="' + i + '" value="' + esc(p.price) + '" inputmode="decimal" aria-label="Precio en euros">' +
        '<button class="icon-btn" data-act="del-product" data-idx="' + i + '" aria-label="Quitar ' + esc(p.name) + '">×</button></div>';
    }).join('') + '</div>' +
      '<div class="btn-row"><button class="btn ghost small" data-act="add-product">Añadir producto</button>' +
      '<button class="btn small" id="save-products" data-act="save-products"' + (state.draftDirty && !state.busy ? '' : ' disabled') + '>Guardar precios</button></div>';
    var sheet = store.demo
      ? '<div class="card"><p><b>Esto es una demo.</b> Lo que apuntes se guarda solo en este navegador.</p><p>Para que lo uséis todos y quede en Google Sheets, instala la versión con hoja de cálculo siguiendo las instrucciones.</p>' +
        '<button class="btn ghost small" data-act="reset-demo"' + dis + '>Reiniciar la demo</button></div>'
      : '<div class="card"><p>Todo se guarda en vuestra hoja de Google: pestañas <b>Rondas</b>, <b>Pagos</b> y <b>Saldos</b>. Desde ahí la podéis descargar como Excel.</p>' +
        (d.sheetUrl ? '<p><a href="' + esc(d.sheetUrl) + '" target="_blank" rel="noopener">Abrir la hoja de cálculo</a></p>' : '') + '</div>';
    var install = '';
    if (store.api && !isStandalone()) {
      install = '<section><h2>Instalar en el móvil</h2><div class="card">' +
        (installPrompt ? '<p>Tenla como una app más: con su icono y a pantalla completa.</p><button class="btn small" data-act="install">Instalar app</button>'

      '<section><h2>Productos y precios</h2>' + products + '<p class="note">Los cambios de precio valen para las rondas nuevas. Las ya apuntadas no cambian.</p></section>' +
      '<section><h2>Dónde se guarda</h2>' + sheet + '</section>';

  function renderSheet() {
    var root = $('sheet-root'), s = state.sheet;
    document.body.style.overflow = s ? 'hidden' : '';
    if (!s) { root.innerHTML = ''; root.dataset.key = ''; return; }
    var inner = '';
    if (s.type === 'picker') {
      var items = state.round.items.get(s.person) || [];
      var counts = new Map(); items.forEach(function (i) { counts.set(i.product, (counts.get(i.product) || 0) + 1); });
      var sum = items.reduce(function (t, i) { return t + i.price; }, 0);
      var rows = state.data.products.map(function (p) {
        var n = counts.get(p.name) || 0;
        return '<div class="prow' + (n ? ' sel' : '') + '"><button class="pick" data-act="pick" data-product="' + esc(p.name) + '"><span>' + esc(p.name) + '</span><span class="pp">' + money(cents(p.price)) + '</span></button>' +
          '<span class="stepper"><button data-act="dec" data-product="' + esc(p.name) + '" aria-label="Uno menos de ' + esc(p.name) + '"' + (n ? '' : ' disabled') + '>−</button>' +
          '<span class="n" aria-label="' + n + ' unidades">' + n + '</span>' +
          '<button data-act="inc" data-product="' + esc(p.name) + '" aria-label="Uno más de ' + esc(p.name) + '">+</button></span></div>';
      }).join('');
      inner = '<div class="sheet-head"><h3 id="sheet-title">' + esc(s.person) + '</h3><span class="sum">' + money(sum) + '</span></div>' +
        '<p class="hint">Toca un producto para elegirlo. Con + pide más de uno.</p>' +
        (rows ? '<div class="plist">' + rows + '</div>' : '<p class="body">No hay productos. Añádelos en Ajustes.</p>') +
        '<div class="sheet-actions">' + (items.length ? '<button class="btn danger" data-act="remove-person">Quitar de la ronda</button>' : '') +
        '<button class="btn dark" data-act="close-sheet">Listo</button></div>';
    } else if (s.type === 'confirm') {
      inner = '<div class="sheet-head"><h3 id="sheet-title">' + esc(s.title) + '</h3></div><p class="body">' + esc(s.text) + '</p>' +
        '<div class="sheet-actions"><button class="btn ghost" data-act="close-sheet">Cancelar</button>' +
        '<button class="btn" data-act="confirm-yes" style="background:var(--neg);color:#fff">' + esc(s.yes) + '</button></div>';
    }
    var key = s.type + ':' + (s.person || s.title);

    if (open && root.dataset.key === key) { open.innerHTML = inner; return; }
    root.dataset.key = key;
    root.innerHTML = '<div class="overlay" data-act="overlay"><div class="sheet" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="sheet-title">' + inner + '</div></div>';

  }

  function toast(msg, action) {
    clearTimeout(state.toastTimer);
    var root = $('toast-root');
    root.innerHTML = '<div class="toast"><span>' + esc(msg) + '</span>' + (action ? '<button data-act="toast-action">' + esc(action.label) + '</button>' : '') + '</div>';
    state.toastAction = action ? action.fn : null;
    state.toastTimer = setTimeout(function () { root.innerHTML = ''; state.toastAction = null; }, action ? 7000 : 4000);
  }

  /* ---------- Acciones ---------- */
  function run(promise) {
    state.writes = (state.writes || 0) + 1;
    state.busy = true; render();
    return Promise.resolve(promise).then(function (data) {
      setData(data); return data;
    }).catch(function (err) {
      toast('No se ha podido guardar: ' + String((err && err.message) || err).replace(/\.$/, '') + '. Inténtalo otra vez.');
      return null;
    }).then(function (res) { state.busy = false; render(); return res; });
  }

  function savePeople(list, okMsg) {
    return run(store.savePeople(list.map(function (p) { return { name: p.name, active: p.active }; }))).then(function (r) { if (r && okMsg) toast(okMsg); return r; });
  }

  var actions = {
    tab: function (el) {
      state.tab = el.dataset.tab; state.sheet = null;
      if (state.tab !== 'ajustes') { state.draft = null; state.draftDirty = false; }
      render(); window.scrollTo(0, 0);
      if (state.tab !== 'ronda') refresh();
    },
    payer: function (el) {
      var n = el.dataset.name;
      state.round.payer = (state.round.payer === n) ? null : n;
      render();
    },
    // Tocar a alguien siempre abre la lista de productos: no se repite lo que pidió la última vez.
    person: function (el) {
      state.sheet = { type: 'picker', person: el.dataset.name }; render();
    },
    pick: function (el) {
      var p = productByName(el.dataset.product); if (!p) return;
      state.round.items.set(state.sheet.person, [{ product: p.name, price: cents(p.price) }]);
      state.sheet = null; render();
    },
    inc: function (el) {
      var p = productByName(el.dataset.product); if (!p) return;
      var list = state.round.items.get(state.sheet.person) || [];
      list.push({ product: p.name, price: cents(p.price) });
      state.round.items.set(state.sheet.person, list); render();
    },
    dec: function (el) {
      var list = state.round.items.get(state.sheet.person) || [];
      for (var i = list.length - 1; i >= 0; i--) { if (list[i].product === el.dataset.product) { list.splice(i, 1); break; } }
      if (list.length) state.round.items.set(state.sheet.person, list); else state.round.items.delete(state.sheet.person);
      render();
    },
    'remove-person': function () { state.round.items.delete(state.sheet.person); state.sheet = null; render(); },
    'close-sheet': function () { state.sheet = null; render(); },
    overlay: function (el, e) { if (e.target === el) { state.sheet = null; render(); } },
    'confirm-yes': function () { var fn = state.sheet && state.sheet.onYes; state.sheet = null; render(); if (fn) fn(); },
    'clear-round': function () { state.round = { payer: null, items: new Map() }; render(); },
    'repeat-last': function () {
      var last = state.data.rounds[state.data.rounds.length - 1]; if (!last) return;
      var names = activeNames(), skipped = 0;
      state.round = { payer: null, items: new Map() };
      last.items.forEach(function (it) {
        var p = productByName(it.product);
        if (names.indexOf(it.person) < 0 || !p) { skipped++; return; }
        var list = state.round.items.get(it.person) || [];
        list.push({ product: p.name, price: cents(p.price) });
        state.round.items.set(it.person, list);
      });
      render();
      if (skipped) toast('Algún producto o persona ya no existe y no se ha copiado.');
    },
    'save-round': function () {
      if (state.busy) return;
      var payer = currentPayer(), items = roundItems();
      if (!payer || !items.length) return;
      var total = items.reduce(function (s, i) { return s + i.price; }, 0);
      run(store.addRound({ payer: payer, items: items.map(function (i) { return { person: i.person, product: i.product, price: i.price / 100 }; }) })).then(function (d) {
        if (!d) return;
        state.round = { payer: null, items: new Map() }; render();
        var id = d.lastId;
        toast('Apuntado: ' + payer + ' ha pagado ' + money(total) + '.', id ? { label: 'Deshacer', fn: function () { run(store.deleteRound(id)).then(function (r) { if (r) toast('Ronda deshecha.'); }); } } : null);
      });
    },
    settle: function (el) {
      if (state.busy) return;
      var from = el.dataset.from, to = el.dataset.to, amount = Number(el.dataset.amount);
      run(store.addPayment({ from: from, to: to, amount: amount / 100 })).then(function (d) {
        if (!d) return;
        var id = d.lastId;
        toast('Apuntado: ' + from + ' ha devuelto ' + money(amount) + ' a ' + to + '.', id ? { label: 'Deshacer', fn: function () { run(store.deletePayment(id)); } } : null);
      });
    },
    'del-round': function (el) {
      var id = el.dataset.id;
      state.sheet = { type: 'confirm', title: '¿Borrar la ronda?', text: 'Desaparece del historial y de las cuentas de todos.', yes: 'Borrar', onYes: function () { run(store.deleteRound(id)).then(function (r) { if (r) toast('Ronda borrada.'); }); } };
      render();
    },
    'del-payment': function (el) {
      var id = el.dataset.id;
      state.sheet = { type: 'confirm', title: '¿Borrar el pago?', text: 'Las cuentas volverán a estar como antes de ese pago.', yes: 'Borrar', onYes: function () { run(store.deletePayment(id)).then(function (r) { if (r) toast('Pago borrado.'); }); } };
      render();
    },
    'hide-person': function (el) {
      var n = el.dataset.name, keep = hasHistory(n);
      var list = keep ? state.data.people.map(function (p) { return { name: p.name, active: p.name === n ? false : p.active }; })
        : state.data.people.filter(function (p) { return p.name !== n; });
      state.round.items.delete(n); if (state.round.payer === n) state.round.payer = null;
      savePeople(list, keep ? n + ' ya no sale en la ronda. Sus cuentas se conservan.' : n + ' quitado.');
    },
    'show-person': function (el) {
      var n = el.dataset.name;
      savePeople(state.data.people.map(function (p) { return { name: p.name, active: p.name === n ? true : p.active }; }), n + ' vuelve a la ronda.');
    },
    'add-product': function () {
      syncDraft(); state.draft.push({ name: '', price: '' }); state.draftDirty = true; render();
      var i = state.draft.length - 1, f = $('pn-' + i); if (f) f.focus();
    },
    'del-product': function (el) { syncDraft(); state.draft.splice(Number(el.dataset.idx), 1); state.draftDirty = true; render(); },
    'save-products': function () {
      syncDraft();
      var list = [], seen = {};
      for (var i = 0; i < state.draft.length; i++) {
        var p = state.draft[i], name = clean(p.name);
        if (!name && !clean(p.price)) continue;
        if (!name) { toast('Falta el nombre de un producto.'); return; }
        var price = parsePrice(p.price);
        if (price === null) { toast('El precio de «' + name + '» no es válido. Escríbelo así: 1,40'); return; }
        var key = name.toLocaleLowerCase('es');
        if (seen[key]) { toast('«' + name + '» está repetido.'); return; }
        seen[key] = true; list.push({ name: name, price: price });
      }
      run(store.saveProducts(list)).then(function (r) { if (r) { state.draft = null; state.draftDirty = false; render(); toast('Precios guardados.'); } });
    },
    'reset-demo': function () {
      state.sheet = { type: 'confirm', title: '¿Reiniciar la demo?', text: 'Se borra lo que hayas probado y vuelven los datos de ejemplo.', yes: 'Reiniciar', onYes: function () {
        state.round = { payer: null, items: new Map() }; state.draft = null;
        run(store.reset()).then(function () { toast('Demo reiniciada.'); });
      } };
      render();
    },
    'toast-action': function () { var fn = state.toastAction; $('toast-root').innerHTML = ''; state.toastAction = null; if (fn) fn(); }
  };

  function syncDraft() {
    if (!state.draft) return;
    document.querySelectorAll('[data-draft]').forEach(function (inp) {
      var i = Number(inp.dataset.idx); if (state.draft[i]) state.draft[i][inp.dataset.draft] = inp.value;
    });
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    var fn = actions[el.dataset.act]; if (fn) fn(el, e);
  });
  document.addEventListener('input', function (e) {
    var t = e.target; if (!t.dataset || !t.dataset.draft) return;
    var i = Number(t.dataset.idx); if (state.draft && state.draft[i]) state.draft[i][t.dataset.draft] = t.value;
    state.draftDirty = true; var b = $('save-products'); if (b) b.disabled = state.busy;
  });
  // Sin <form>: en marcos protegidos (como el de la demo) el navegador bloquea el envío de formularios.
  function addPerson() {
    var input = $('new-person');
    if (!input || state.busy) return;
    var name = clean(input.value);
    if (!name) { input.focus(); return; }
    var existing = state.data.people.find(function (p) { return sameName(p.name, name); });
    if (existing && existing.active) { toast(existing.name + ' ya está en la lista.'); return; }
    var list = existing
      ? state.data.people.map(function (p) { return { name: p.name, active: p === existing ? true : p.active }; })
      : state.data.people.concat([{ name: name, active: true }]);
    syncDraft();
    input.value = '';
    savePeople(list).then(function (r) {
      var f = $('new-person'); if (!f) return;
      if (!r) f.value = name; // si falla, se recupera lo escrito
      f.focus();
    });
  }
  actions['add-person'] = addPerson;

  /* ---------- Entrar con tu cuenta ---------- */
  function register(name) {
    name = clean(name);
    if (!name || state.busy) { var f = $('my-name'); if (f) f.focus(); return; }
    run(store.register(name)).then(function (d) {
      if (d && d.me && d.me.name) { state.tab = 'ronda'; render(); toast('¡Hola, ' + d.me.name + '! Ya estás en la ronda.'); }
    });
  }
  function rename() {
    var input = $('rename'); if (!input || state.busy) return;
    var name = clean(input.value), old = state.data.me.name;
    if (!name) { input.focus(); return; }
    if (name === old) return;
    run(store.rename(name)).then(function (d) {
      if (!d) return;
      // La ronda en curso usa nombres: se actualiza también.
      if (state.round.items.has(old)) { var its = state.round.items.get(old); state.round.items.delete(old); state.round.items.set(name, its); }
      if (state.round.payer === old) state.round.payer = name;
      render(); toast('Ahora apareces como ' + name + '.');
    });
  }
  actions.claim = function (el) { register(el.dataset.name); };
  actions.logout = function () {
    if (!store.api) return;
    store.auth.signOut();
    state.needLogin = true; state.data = null; state.sheet = null; state.tab = 'ronda';
    state.round = { payer: null, items: new Map() };
    render();
  };
  actions.install = function () {
    var p = installPrompt; if (!p) return;
    installPrompt = null;
    p.prompt();
    p.userChoice.then(function () { render(); }).catch(function () { /* cancelado */ });
  };
  actions.register = function () { register(($('my-name') || {}).value); };
  actions.rename = rename;
  actions['demo-switch'] = function () {
    state.round = { payer: null, items: new Map() };
    run(store.switchUser()).then(function () { window.scrollTo(0, 0); });
  };

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.isComposing || !e.target) return;
    var id = e.target.id;
    if (id === 'new-person') { e.preventDefault(); addPerson(); }
    else if (id === 'my-name') { e.preventDefault(); register(e.target.value); }
    else if (id === 'rename') { e.preventDefault(); rename(); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && state.sheet) { state.sheet = null; render(); } });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') refresh(); });

  function refresh() {
    if (state.busy || !state.data || state.draftDirty) return;
    var seq = state.writes || 0;
    store.load().then(function (d) {
      // Si se guardó algo mientras cargaba, estos datos ya son viejos.
      if (state.busy || (state.writes || 0) !== seq || state.draftDirty) return;
      setData(d); render();
    }).catch(function (err) { if (err && err.code === 'login') render(); });
  }

  // Instalar como app (Android/Chrome avisa con beforeinstallprompt; iPhone se hace desde Safari).
  var installPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installPrompt = e; if (state.tab === 'ajustes') render(); });
  window.addEventListener('appinstalled', function () { installPrompt = null; toast('App instalada.'); });
  function isStandalone() { return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
  function isIOS() { return /iPhone|iPad|iPod/.test(navigator.userAgent); }

  /* ---------- Arranque ---------- */
  $('today').textContent = cap(fmtDay.format(new Date()));

  function showError(title, msg) {
    $('main').innerHTML = '<div class="empty"><h3>' + esc(title) + '</h3><p>' + esc(msg) + '</p><button class="btn" type="button" data-act="reload">Reintentar</button></div>';
  }
  actions.reload = function () { location.reload(); };

  function loadAll() {
    if (!state.data) $('main').innerHTML = '<p class="loading">Cargando cafés…</p>';
    store.load().then(function (d) {
      setData(d);
      render();
    }).catch(function (err) {
      if (err && err.code === 'login') { render(); return; }
      showError('No se pudo cargar', (err && err.message) || String(err));
    });
  }

  loadConfig().then(function (cfg) {
    var api = !!(cfg && cfg.apiUrl);
    if (api && (/PEGA_AQUI/.test(cfg.apiUrl) || !cfg.googleClientId || /PEGA_AQUI/.test(cfg.googleClientId))) {
      showError('Falta configurar la app', 'Abre config.js y pega la dirección del Apps Script y el ID de cliente de Google.');
      return;
    }
    store = isSheets ? sheetsStore() : api ? apiStore(cfg) : demoStore();
    $('status').textContent = store.demo ? 'Demo' : 'Conectando…';
    if (store.api) {
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { /* sin modo app */ });
      store.auth.onSignIn(function () { state.needLogin = false; loadAll(); });
      if (!store.auth.current()) { state.needLogin = true; render(); return; }
    }
    loadAll();
  });
})();
</script>
</body>
</html>
