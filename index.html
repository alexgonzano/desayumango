:root {
  /* Estilo iOS: fondo agrupado gris claro, tarjetas blancas, letra del sistema y azul de Apple. */
  --bg: #f2f2f7;
  --surface: #ffffff;
  --ink: #1d1d1f;
  --muted: #6e6e73;
  --line: rgba(60, 60, 67, 0.18);
  --accent: #0071e3;
  --accent-ink: #ffffff;
  --accent-soft: rgba(0, 113, 227, 0.1);
  --fill: rgba(118, 118, 128, 0.12);
  --line-strong: rgba(60, 60, 67, 0.3);
  --pos: #248a3d;
  --neg: #d70015;
  --bar-bg: rgba(249, 249, 249, 0.86);
  --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
  --receipt-shadow: drop-shadow(0 4px 16px rgba(0, 0, 0, 0.08));
  --radius: 12px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "SF Pro Display", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --ticket: "Doto Ticket", ui-monospace, SFMono-Regular, Menlo, monospace;
  --ease: cubic-bezier(0.25, 0.1, 0.25, 1);
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #000000; --surface: #1c1c1e; --ink: #f5f5f7; --muted: #98989d; --line: rgba(84, 84, 88, 0.65);
    --accent: #0a84ff; --accent-ink: #ffffff; --accent-soft: rgba(10, 132, 255, 0.2);
    --fill: rgba(118, 118, 128, 0.24); --line-strong: rgba(235, 235, 245, 0.3);
    --pos: #30d158; --neg: #ff453a; --bar-bg: rgba(22, 22, 24, 0.86);
    --shadow: none; --receipt-shadow: none;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #000000; --surface: #1c1c1e; --ink: #f5f5f7; --muted: #98989d; --line: rgba(84, 84, 88, 0.65);
  --accent: #0a84ff; --accent-ink: #ffffff; --accent-soft: rgba(10, 132, 255, 0.2);
  --fill: rgba(118, 118, 128, 0.24); --line-strong: rgba(235, 235, 245, 0.3);
  --pos: #30d158; --neg: #ff453a; --bar-bg: rgba(22, 22, 24, 0.86);
  --shadow: none; --receipt-shadow: none;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 17px/1.47 var(--font); letter-spacing: -0.022em;
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent;
}
button, input { font: inherit; color: inherit; letter-spacing: inherit; }
button { cursor: pointer; }
button:disabled { cursor: default; opacity: 0.4; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: var(--accent); text-decoration: none; }

.app { max-width: 680px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(112px + env(safe-area-inset-bottom)); }
body.no-tabs .app { padding-bottom: 48px; }

/* Cabecera: título grande al estilo iOS */
.top { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; margin: 12px 0 24px; }
.eyebrow { margin: 0; font-size: 13px; font-weight: 600; letter-spacing: 0; text-transform: uppercase; color: var(--muted); }
h1 { margin: 2px 0 0; font-size: 34px; line-height: 1.12; font-weight: 700; letter-spacing: -0.03em; text-wrap: balance; }
.status {
  flex: none; display: inline-flex; align-items: center; gap: 8px; padding: 6px 14px; border-radius: 980px;
  background: var(--surface); box-shadow: var(--shadow); font-size: 15px; font-weight: 500; white-space: nowrap;
}
.status[data-initial]:not([data-initial=""]) { padding-left: 4px; }
.status[data-initial]:not([data-initial=""])::before {
  content: attr(data-initial); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent); color: var(--accent-ink); font-size: 13px; font-weight: 600; letter-spacing: 0;
}

/* Barra de pestañas inferior, como en una app de iPhone */
.tabs {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: flex; justify-content: center; padding: 6px 8px calc(6px + env(safe-area-inset-bottom));
  background: var(--bar-bg); -webkit-backdrop-filter: saturate(180%) blur(20px); backdrop-filter: saturate(180%) blur(20px);
  border-top: 0.5px solid var(--line);
}
.tab {
  position: relative; flex: 1; max-width: 170px; min-height: 50px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  appearance: none; border: 0; border-radius: 10px; background: none; padding: 4px 0;
  font-size: 11px; font-weight: 500; letter-spacing: 0; color: var(--muted); transition: color 0.2s var(--ease);
}
.tab svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-selected="true"] { color: var(--accent); }
.tab.has-dot::after { content: ""; position: absolute; top: 4px; left: calc(50% + 8px); width: 9px; height: 9px; border-radius: 50%; background: var(--neg); border: 2px solid var(--bar-bg); }
body.no-tabs .tabs { display: none; }

/* Secciones y listas agrupadas */
section + section { margin-top: 32px; }
h2 {
  display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 0 8px; padding: 0 16px;
  font-size: 13px; font-weight: 400; letter-spacing: 0; text-transform: uppercase; color: var(--muted);
}
h2 .link { min-height: 0; padding: 0; font-size: 15px; text-transform: none; }
.link {

  color: var(--accent); font-size: 17px; font-weight: 400;
}
.note { margin: 8px 16px 0; font-size: 13px; line-height: 1.38; letter-spacing: -0.01em; color: var(--muted); max-width: 62ch; }

.group, .rows, .card, .plist { background: var(--surface); border-radius: var(--radius); overflow: hidden; }
.card { padding: 16px; }
.card p { margin: 0 0 10px; }
.card p:last-child { margin-bottom: 0; }
.row, .bal, .xfer, .prow, .entry { position: relative; }
.row + .row::before, .bal + .bal::before, .xfer + .xfer::before, .prow + .prow::before, .entry + .entry::before {
  content: ""; position: absolute; top: 0; left: 16px; right: 0; height: 0.5px; background: var(--line);
}
.row { display: flex; align-items: center; gap: 12px; min-height: 48px; padding: 8px 16px; }
.row .grow { flex: 1; min-width: 0; overflow-wrap: anywhere; }
.row.muted .grow { color: var(--muted); }
.row .sub { display: block; font-size: 13px; color: var(--muted); overflow-wrap: anywhere; }
.row .acts { display: flex; gap: 8px; flex: none; }
.rows > .note { margin: 0; padding: 14px 16px; }

/* Botones en forma de píldora */
.btn {
  position: relative; appearance: none; border: 0; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 50px; padding: 0 24px; border-radius: 980px; background: var(--accent); color: var(--accent-ink);
  font-family: var(--font); font-size: 17px; font-weight: 600; letter-spacing: -0.02em;
  transition: transform 0.2s var(--ease), filter 0.2s var(--ease);
}
.btn:active:not(:disabled) { transform: scale(0.98); }
@media (hover: hover) { .btn:hover:not(:disabled) { filter: brightness(1.08); } }
.btn.small { min-height: 36px; padding: 0 16px; font-size: 15px; }
.btn.small::after, .link::after, .stepper button::after, .icon-btn::after { content: ""; position: absolute; inset: -5px; }
.btn.block { width: 100%; margin-top: 16px; }
.btn.ghost { background: var(--fill); color: var(--accent); }
.btn.danger { background: var(--fill); color: var(--neg); }
.btn.dark { background: var(--accent); color: var(--accent-ink); }
.btn-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }

/* Campos de texto */
.field {
  width: 100%; min-width: 0; min-height: 44px; padding: 10px 12px; border: 0; border-radius: 10px;
  background: var(--fill); font-size: 17px; color: var(--ink);
}
.field::placeholder { color: var(--muted); }
.field:focus { outline: 2px solid var(--accent); outline-offset: 0; }
.field.price { width: 6em; flex: none; text-align: right; font-variant-numeric: tabular-nums; }
.add-form { display: flex; gap: 8px; margin-top: 12px; }
.add-form .btn { flex: none; white-space: nowrap; }
.icon-btn {
  position: relative; flex: none; width: 34px; height: 34px; border-radius: 50%; border: 0;
  background: var(--fill); color: var(--neg); font-size: 20px; line-height: 1;
}
.tag-acc {
  margin-left: 8px; padding: 2px 8px; border-radius: 980px; background: var(--fill);
  font-size: 12px; font-weight: 500; letter-spacing: 0; color: var(--muted); vertical-align: 2px;
}
.card .who-am-i { overflow-wrap: anywhere; }
.card .who-am-i span { color: var(--muted); }

/* Quién paga */
.chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px; padding: 2px 16px 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 44px; padding: 0 18px;
  appearance: none; border: 0; border-radius: 980px; background: var(--surface); color: var(--ink);
  font-size: 15px; font-weight: 500; transition: background-color 0.2s var(--ease), color 0.2s var(--ease);
}
.chip[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.chip .tag { font-size: 12px; font-weight: 600; letter-spacing: 0; color: var(--accent); }
.chip[aria-pressed="true"] .tag { color: inherit; opacity: 0.85; }

/* Quién toma algo */
.people { display: grid; grid-template-columns: repeat(auto-fill, minmax(104px, 1fr)); gap: 8px; }
.person {
  display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 52px; padding: 8px 10px 8px 14px;
  appearance: none; border: 0; border-radius: var(--radius); background: var(--surface); color: var(--ink); text-align: left;
  transition: box-shadow 0.2s var(--ease), transform 0.15s var(--ease);
}
.person:active { transform: scale(0.97); }
.person .name { min-width: 0; font-size: 16px; font-weight: 500; overflow-wrap: anywhere; }
.person .mark {
  flex: none; width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center;
  border: 1.5px solid var(--line-strong); color: var(--muted); font-size: 14px; font-weight: 600; line-height: 1;
}
.person.on { box-shadow: inset 0 0 0 2px var(--accent); }
.person.on .mark { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-size: 13px; }

.empty { padding: 28px 20px; border-radius: var(--radius); background: var(--surface); text-align: center; }
.empty h3 { margin: 0 0 6px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
.empty p { margin: 0 auto 16px; max-width: 40ch; color: var(--muted); }

/* Ticket de la compra: letra de puntos, como las impresoras de tickets */
.receipt {
  position: relative; margin: 32px 4px 12px; padding: 22px 18px 18px;
  background: var(--surface); color: var(--ink); font: 900 16px/1.45 var(--ticket); font-variation-settings: "ROND" 100;
  letter-spacing: 0.02em; font-variant-numeric: tabular-nums; filter: var(--receipt-shadow);
}
.receipt::before, .receipt::after { content: ""; position: absolute; left: 0; right: 0; height: 8px; }
.receipt::before { top: -7px; background: radial-gradient(circle at 7px 0, transparent 5.5px, var(--surface) 6px) 0 0 / 14px 8px repeat-x; }
.receipt::after { bottom: -7px; background: radial-gradient(circle at 7px 8px, transparent 5.5px, var(--surface) 6px) 0 0 / 14px 8px repeat-x; }
.r-head { text-align: center; }
.r-title { font-size: 19px; letter-spacing: 0.08em; }
.r-meta { margin-top: 4px; font-size: 14px; color: var(--muted); }
.r-sep { margin: 12px 0; border: 0; border-top: 1.5px dashed var(--line-strong); }
.r-cols, .r-line { display: grid; grid-template-columns: minmax(0, 92px) minmax(0, 1fr) 64px; gap: 10px; align-items: baseline; }
.r-cols { margin-bottom: 2px; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.r-line {
  appearance: none; width: calc(100% + 8px); margin: 0 -4px; padding: 6px 4px; border: 0; border-radius: 6px;
  background: none; color: inherit; font: inherit; letter-spacing: inherit; text-align: left;
}
@media (hover: hover) { .r-line:hover { background: var(--fill); } }
.r-line .who, .r-line .what { overflow-wrap: anywhere; }
.receipt .amt { font: inherit; letter-spacing: inherit; color: inherit; }
.r-cols span:last-child, .r-line .amt { text-align: right; }
.r-empty { margin: 4px 0; text-align: center; color: var(--muted); font: 400 15px/1.4 var(--font); letter-spacing: -0.01em; }
.r-count { margin-top: 4px; font-size: 14px; color: var(--muted); }
.t-label { font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.t-order { margin-top: 3px; font-size: 16px; line-height: 1.45; }
.t-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.t-total { font-size: 34px; letter-spacing: 0; line-height: 1; }
.t-sub { margin-top: 12px; font: 400 15px/1.4 var(--font); letter-spacing: -0.01em; color: var(--muted); }

/* Hoja inferior y diálogos, como las de iOS */
.overlay {
  position: fixed; inset: 0; z-index: 30; display: flex; align-items: flex-end; justify-content: center;
  background: rgba(0, 0, 0, 0.32); animation: fade 0.25s var(--ease);
}
.sheet {
  width: 100%; max-width: 680px; max-height: 88%; overflow: auto;
  padding: 8px 16px calc(16px + env(safe-area-inset-bottom)); border-radius: 14px 14px 0 0;
  background: var(--bg); animation: rise 0.32s var(--ease);
}
.sheet::before { content: ""; display: block; width: 36px; height: 5px; border-radius: 3px; background: var(--line-strong); margin: 0 auto 14px; }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { transform: translateY(40px); opacity: 0.6; } }
.sheet-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 0 4px; }
.sheet-head h3 { margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.03em; }
.sheet-head .sum { font-size: 20px; font-weight: 600; color: var(--accent); font-variant-numeric: tabular-nums; }
.sheet .hint { margin: 4px 4px 12px; font-size: 15px; color: var(--muted); }
.prow { display: flex; align-items: center; gap: 10px; padding: 0 10px 0 16px; }
.pick {
  flex: 1; min-width: 0; min-height: 50px; display: flex; justify-content: space-between; align-items: center; gap: 10px;
  appearance: none; border: 0; background: none; text-align: left; padding: 0; font-size: 17px; color: var(--ink);
}
.pick .pp { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.prow.sel .pick { color: var(--accent); font-weight: 600; }
.stepper { flex: none; display: flex; align-items: center; height: 34px; border-radius: 9px; background: var(--fill); }
.stepper button {
  position: relative; appearance: none; border: 0; background: none; width: 40px; height: 34px;
  font-size: 22px; font-weight: 400; line-height: 1; color: var(--ink);
}
.stepper .n { min-width: 22px; text-align: center; font-size: 15px; font-weight: 600; font-variant-numeric: tabular-nums; }
.sheet-actions { display: flex; gap: 10px; margin-top: 16px; }
.sheet-actions .btn { flex: 1; }
.sheet p.body { margin: 8px 4px 0; color: var(--muted); }

/* Cuentas */
.hero { padding: 20px; border-radius: 18px; background: var(--surface); box-shadow: var(--shadow); }
.hero .k { font-size: 15px; color: var(--muted); }
.hero .who { margin: 2px 0 4px; font-size: 40px; line-height: 1.1; font-weight: 700; letter-spacing: -0.035em; overflow-wrap: anywhere; }
.hero .why { font-size: 15px; color: var(--muted); }
.bal { display: grid; grid-template-columns: minmax(0, 7em) 1fr auto; gap: 12px; align-items: center; min-height: 56px; padding: 8px 16px; }
.bal .n { font-weight: 500; overflow-wrap: anywhere; }
.bar { position: relative; height: 6px; }
.bar::before { content: ""; position: absolute; left: 50%; top: -6px; bottom: -6px; width: 1px; background: var(--line); }
.bar span { position: absolute; top: 0; bottom: 0; border-radius: 3px; }
.bar .p { left: 50%; background: var(--pos); }
.bar .m { right: 50%; background: var(--neg); }
.amt { text-align: right; font-size: 17px; font-weight: 600; letter-spacing: -0.01em; font-variant-numeric: tabular-nums; }
.amt small { display: block; font-size: 12px; font-weight: 400; letter-spacing: 0; color: var(--muted); }
.amt.pos { color: var(--pos); }
.amt.neg { color: var(--neg); }
.xfer { display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 8px 16px; }
.xfer .what { flex: 1; min-width: 0; }
.xfer .what b { font-weight: 600; }
.xfer .amt { flex: none; }

/* Historial */
.day + .day { margin-top: 28px; }
.entry summary {
  list-style: none; display: grid; grid-template-columns: 3.2em 1fr auto; gap: 12px; align-items: baseline;
  min-height: 48px; padding: 12px 16px; cursor: pointer;
}
.entry summary::-webkit-details-marker { display: none; }
.entry .time { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }
.entry .what b { font-weight: 600; }
.entry .what small { font-size: 15px; color: var(--muted); }
.entry .by { display: block; font-size: 13px; color: var(--muted); }
.entry[open] summary .amt { color: var(--accent); }
.items { list-style: none; margin: 0 16px 12px calc(28px + 3.2em); padding: 0; font-size: 15px; }
.items li { display: flex; justify-content: space-between; gap: 10px; padding: 3px 0; }
.items li span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
.entry .del { margin: 0 16px 14px calc(28px + 3.2em); }
.entry.pay .what { color: var(--muted); }
.entry.pay .what b { color: var(--ink); }

/* Entrar, pedir acceso, bienvenida */
.welcome { padding-top: 32px; text-align: center; }
.app-icon { display: block; width: 76px; height: 76px; margin: 0 auto 20px; border-radius: 18px; box-shadow: 0 6px 20px rgba(0, 0, 0, 0.18); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .app-icon { box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.16); } }
:root[data-theme="dark"] .app-icon { box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.16); }
.welcome .eyebrow { margin-bottom: 8px; overflow-wrap: anywhere; }
.welcome .mail { text-transform: none; letter-spacing: 0; }
.welcome h2.big {
  display: block; margin: 0 0 10px; padding: 0; color: var(--ink); text-transform: none;
  font-size: 28px; line-height: 1.15; font-weight: 700; letter-spacing: -0.03em; text-wrap: balance;
}
.welcome p { margin: 0 auto 16px; max-width: 36ch; color: var(--muted); }
.welcome .chips { justify-content: center; flex-wrap: wrap; overflow: visible; margin: 0 0 22px; padding: 0; }
.welcome .add-form { max-width: 420px; margin: 0 auto 12px; }
.welcome .btn-row { justify-content: center; }
.welcome .note { margin: 12px auto 0; }
.gsi { display: flex; justify-content: center; min-height: 44px; margin: 8px 0 4px; }

/* Pantalla de entrar */
body.is-login .top { display: none; }
.login { max-width: 420px; margin: 0 auto; padding-top: 40px; text-align: center; }
.login .app-icon { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 22px; }
.login h2.login-title {
  display: block; margin: 0; padding: 0; color: var(--ink); text-transform: none;
  font-size: 40px; line-height: 1.1; font-weight: 700; letter-spacing: -0.035em;
}
.login-lead { margin: 10px auto 32px; max-width: 30ch; font-size: 17px; color: var(--muted); text-wrap: balance; }
.features { list-style: none; margin: 0 auto 36px; padding: 0; display: grid; gap: 20px; text-align: left; }
.features li { display: grid; grid-template-columns: 34px 1fr; gap: 14px; align-items: start; }
.features svg { width: 30px; height: 30px; fill: none; stroke: var(--accent); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.features b { display: block; font-size: 16px; font-weight: 600; letter-spacing: -0.015em; }
.features span { display: block; font-size: 15px; line-height: 1.35; color: var(--muted); }
.login .gsi { min-height: 48px; }
.login .note { margin: 12px auto 0; text-align: center; }

/* Aviso de solicitudes */
.notice {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 24px;
  padding: 12px 12px 12px 16px; border-radius: var(--radius); background: var(--surface); box-shadow: var(--shadow); font-size: 15px;
}
.notice > span { position: relative; padding-left: 18px; }
.notice > span::before { content: ""; position: absolute; left: 0; top: 0.5em; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
.notice .btn { flex: none; }

/* Aviso flotante */
.toast {
  position: fixed; left: 50%; z-index: 40; transform: translateX(-50%);
  bottom: calc(84px + env(safe-area-inset-bottom)); width: max-content; max-width: calc(100% - 32px);
  display: flex; align-items: center; gap: 14px; padding: 12px 16px; border-radius: 14px;
  background: rgba(30, 30, 32, 0.92); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
  color: #ffffff; font-size: 15px; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.2); animation: toastIn 0.3s var(--ease);
}
body.no-tabs .toast { bottom: calc(24px + env(safe-area-inset-bottom)); }
.toast button { flex: none; appearance: none; border: 0; background: none; color: #64d2ff; font-weight: 600; padding: 4px; }
@keyframes toastIn { from { opacity: 0; transform: translate(-50%, 8px); } }

/* Cambio de pestaña */
.enter { animation: fadeUp 0.3s var(--ease); }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } }

.loading { padding: 48px 0; text-align: center; color: var(--muted); font-size: 15px; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
</style>
</head>

<div class="app">
  <header class="top">

    <button class="tab" role="tab" id="tab-cuentas" data-act="tab" data-tab="cuentas"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v16M8 20h8M5 8h14"/><path d="M5 8l-2.5 6a2.5 2.5 0 0 0 5 0z"/><path d="M19 8l-2.5 6a2.5 2.5 0 0 0 5 0z"/></svg><span>Cuentas</span></button>

  <main id="main" role="tabpanel"><p class="loading">Cargando cafés…</p></main>
</div>

<script>
(function () {
  'use strict';

  /* ---------- Datos por defecto ---------- */
  var PRODUCTOS_INICIALES = [
    { name: 'Café solo', price: 1.30 },
    { name: 'Cortado', price: 1.40 },
    { name: 'Café con leche', price: 1.60 },
    { name: 'Americano', price: 1.50 },
    { name: 'Capuchino', price: 2.00 },
    { name: 'Descafeinado', price: 1.60 },
    { name: 'Té o infusión', price: 1.50 },
    { name: 'Cola Cao', price: 1.80 }
  ];

  /* ---------- Utilidades ---------- */
  var eur = new Intl.NumberFormat('es-ES', { style: 'currency', currency: 'EUR' });
  function money(c) { return eur.format((c || 0) / 100); }
  function signed(c) { return c === 0 ? money(0) : (c > 0 ? '+' : '−') + eur.format(Math.abs(c) / 100); }
  function cents(e) { return Math.round(Number(e) * 100) || 0; }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (ch) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[ch];
    });
  }
  function clean(s) { return String(s == null ? '' : s).replace(/\s+/g, ' ').trim(); }
  function sameName(a, b) { return clean(a).toLocaleLowerCase('es') === clean(b).toLocaleLowerCase('es'); }
  function byName(a, b) { return a.localeCompare(b, 'es', { sensitivity: 'base' }); }
  function parsePrice(v) {
    var n = parseFloat(String(v).replace(/[€\s]/g, '').replace(',', '.'));
    return isFinite(n) && n >= 0 ? Math.round(n * 100) / 100 : null;
  }
  function priceText(e) { return (Math.round(e * 100) / 100).toFixed(2).replace('.', ','); }
  function localDay(iso) { var d = new Date(iso); return d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); }
  var fmtDay = new Intl.DateTimeFormat('es-ES', { weekday: 'long', day: 'numeric', month: 'long' });
  var fmtShortDay = new Intl.DateTimeFormat('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
  var fmtTime = new Intl.DateTimeFormat('es-ES', { hour: '2-digit', minute: '2-digit' });
  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }

  /* ---------- Lógica de cuentas (en céntimos) ---------- */
  // Saldo > 0: ha adelantado más de lo que ha tomado (le deben). Saldo < 0: debe.
  function balances(data) {
    var b = new Map();
    function add(n, v) { b.set(n, (b.get(n) || 0) + v); }
    data.people.forEach(function (p) { b.set(p.name, 0); });
    data.rounds.forEach(function (r) {

  // El ticket: una línea por persona y producto, en el orden en que se añaden.
  function viewReceipt() {
    var items = roundItems(), order = productOrder(), now = new Date();
    var total = items.reduce(function (s, i) { return s + i.price; }, 0);
    var payer = currentPayer();
    var own = items.filter(function (i) { return i.person === payer; }).reduce(function (s, i) { return s + i.price; }, 0);
    var lines = [];
    state.round.items.forEach(function (list, person) {
      groupCounts(list.map(function (i) { return i.product; }), order).forEach(function (e) {
        var amt = list.filter(function (i) { return i.product === e[0]; }).reduce(function (s, i) { return s + i.price; }, 0);
        lines.push('<button class="r-line" data-act="person" data-name="' + esc(person) + '" aria-label="Cambiar lo de ' + esc(person) + '">' +
          '<span class="who">' + esc(person) + '</span><span class="what">' + (e[1] > 1 ? e[1] + '× ' : '') + esc(e[0]) + '</span>' +
          '<span class="amt">' + priceText(amt / 100) + '</span></button>');
      });
    });
    var counts = groupCounts(items.map(function (i) { return i.product; }), order);
    var orderTxt = counts.map(function (e) { return e[1] + '× ' + esc(e[0]); }).join(' · ');
    var n = items.length;
    var sub = !n ? 'Cada uno le deberá a quien paga lo que ha tomado.'
      : !payer ? 'Elige quién paga.'
      : 'Paga <b>' + esc(payer) + '</b>.' + (total - own > 0 ? ' Los demás le deberán ' + money(total - own) + '.' : '');
    return '<section class="receipt" aria-label="Ticket de la ronda">' +
      '<div class="r-head"><div class="r-title">DesayuMango</div><div class="r-meta">' + esc(cap(fmtShortDay.format(now))) + ' · ' + fmtTime.format(now) + '</div></div>' +
      '<hr class="r-sep">' +
      (n ? '<div class="r-cols" aria-hidden="true"><span>Quién</span><span>Qué</span><span>€</span></div>' + lines.join('')
         : '<p class="r-empty">Todavía no hay nada. Toca a quien quiera algo.</p>') +
      '<hr class="r-sep">' +
      '<div class="t-row"><span class="t-label">Total</span><span class="t-total">' + money(total) + '</span></div>' +
      (n ? '<div class="r-count">' + n + (n === 1 ? ' consumición' : ' consumiciones') + '</div>' +
           '<hr class="r-sep"><div class="t-label">Para pedir en la barra</div><div class="t-order">' + orderTxt + '</div>' : '') +
      '<div class="t-sub">' + sub + '</div>' +
      '<button class="btn block" data-act="save-round"' + (!n || !payer || state.busy ? ' disabled' : '') + '>' +
      (state.busy ? 'Apuntando…' : 'Apuntar ronda') + '</button></section>';
  }

  function renderTicket() { $('ticket').innerHTML = ''; }

  function viewCuentas() {
    var d = state.data, bal = state.bal, names = activeNames();
    if (!d.rounds.length && !d.payments.length) {
      return '<div class="empty"><h3>Aún no hay rondas</h3><p>Cuando apuntéis la primera, aquí veréis quién debe a quién y a quién le toca pagar.</p>' +
        '<button class="btn" data-act="tab" data-tab="ronda">Ir a la ronda</button></div>';
    }
    var next = names.length ? suggestPayer(d, names, bal) : null;
    var nb = next ? (bal.get(next) || 0) : 0;
    var why = nb < 0 ? 'Es quien más debe: ' + money(-nb) + '.' : 'Nadie debe nada. Le toca a quien hace más que no paga.';
    var shown = names.slice();
    bal.forEach(function (v, n) { if (v !== 0 && shown.indexOf(n) < 0) shown.push(n); });
    shown.sort(function (a, b) { return (bal.get(a) || 0) - (bal.get(b) || 0) || byName(a, b); });
    var max = 1; shown.forEach(function (n) { max = Math.max(max, Math.abs(bal.get(n) || 0)); });
    var rows = shown.map(function (n) {
      var v = bal.get(n) || 0, w = Math.round(Math.abs(v) / max * 50 * 10) / 10;
      var cls = v > 0 ? 'pos' : v < 0 ? 'neg' : '';
      var label = v > 0 ? 'le deben' : v < 0 ? 'debe' : 'en paz';
      return '<div class="bal"><span class="n">' + esc(n) + '</span>' +
        '<span class="bar" aria-hidden="true">' + (v ? '<span class="' + (v > 0 ? 'p' : 'm') + '" style="width:' + w + '%"></span>' : '') + '</span>' +
        '<span class="amt ' + cls + '">' + signed(v) + '<small>' + label + '</small></span></div>';
    }).join('');
    var xf = settle(bal);
    var xfers = xf.length ? '<div class="group">' + xf.map(function (t) {
      return '<div class="xfer"><span class="what"><b>' + esc(t.from) + '</b> paga a <b>' + esc(t.to) + '</b></span>' +
        '<span class="amt">' + money(t.amount) + '</span>' +

    }).join('') + '</div>' : '<p class="note">Estáis todos a cero.</p>';
    return (next ? '<section class="hero"><div class="k">La próxima ronda la paga</div><div class="who">' + esc(next) + '</div><div class="why">' + why + '</div></section>' : '') +
      '<section><h2>Saldos</h2><div class="group">' + rows + '</div>' +
      '<p class="note">Positivo: ha adelantado más de lo que ha tomado. Si paga siempre quien más debe, las cuentas se equilibran solas.</p></section>' +
      '<section><h2>Para quedar a cero</h2>' + xfers +
      (xf.length ? '<p class="note">Pulsa «Hecho» cuando alguien haga el Bizum o pague en efectivo.</p>' : '') + '</section>';
  }

  function viewHistorial() {
    var d = state.data, order = productOrder();
    var entries = d.rounds.map(function (r) { return { kind: 'r', date: r.date, r: r }; })
      .concat(d.payments.map(function (p) { return { kind: 'p', date: p.date, p: p }; }))
      .sort(function (a, b) { return a.date < b.date ? 1 : a.date > b.date ? -1 : 0; });
    if (!entries.length) return '<div class="empty"><h3>Sin movimientos</h3><p>Aquí aparecerá cada ronda que apuntéis y cada pago entre vosotros.</p></div>';
    var limited = entries.slice(0, 80);
    var today = localDay(new Date().toISOString());
    var yd = new Date(); yd.setDate(yd.getDate() - 1); var yesterday = localDay(yd.toISOString());
    var groups = [], cur = null;
    limited.forEach(function (e) {
      var k = localDay(e.date);
      if (!cur || cur.k !== k) { cur = { k: k, date: e.date, list: [] }; groups.push(cur); }
      cur.list.push(e);
    });
    var html = groups.map(function (g) {
      var label = g.k === today ? 'Hoy' : g.k === yesterday ? 'Ayer' : cap(fmtShortDay.format(new Date(g.date)));
      return '<section class="day"><h2>' + esc(label) + '</h2><div class="group">' + g.list.map(function (e) {
        var t = fmtTime.format(new Date(e.date));
        if (e.kind === 'r') {
          var r = e.r, total = r.items.reduce(function (s, i) { return s + cents(i.price); }, 0);
          var n = r.items.length;
          var lis = r.items.map(function (i) { return '<li><span>' + esc(i.person) + ' · ' + esc(i.product) + '</span><span>' + money(cents(i.price)) + '</span></li>'; }).join('');
          return '<details class="entry"><summary><span class="time">' + t + '</span><span class="what"><b>' + esc(r.payer) + '</b> pagó <small>' + n + (n === 1 ? ' café' : ' cafés') + '</small>' +
            (r.by ? '<span class="by">Apuntó ' + esc(r.by === state.data.me.name ? 'tú' : r.by) + '</span>' : '') + '</span>' +
            '<span class="amt">' + money(total) + '</span></summary><ul class="items">' + lis + '</ul>' +
            '<button class="btn danger small del" data-act="del-round" data-id="' + esc(r.id) + '">Borrar esta ronda</button></details>';
        }
        var p = e.p;
        return '<details class="entry pay"><summary><span class="time">' + t + '</span><span class="what"><b>' + esc(p.from) + '</b> devolvió a <b>' + esc(p.to) + '</b>' +
          (p.by ? '<span class="by">Apuntó ' + esc(p.by === state.data.me.name ? 'tú' : p.by) + '</span>' : '') + '</span>' +
          '<span class="amt">' + money(cents(p.amount)) + '</span></summary>' +
          '<button class="btn danger small del" data-act="del-payment" data-id="' + esc(p.id) + '">Borrar este pago</button></details>';
      }).join('') + '</div></section>';
    }).join('');
    if (entries.length > limited.length) html += '<p class="note">Se muestran los últimos ' + limited.length + ' movimientos. El resto está en la hoja de cálculo.</p>';
    return html;
  }

      return '<div class="row"><span class="grow">' + esc(r.name || r.email) + '<span class="sub">' + esc(r.email) + '</span></span>' +
        '<span class="acts"><button class="btn small" type="button" data-act="approve" data-email="' + esc(r.email) + '"' + dis + '>Aceptar</button>' +
        '<button class="btn ghost small" type="button" data-act="reject" data-email="' + esc(r.email) + '"' + dis + '>Rechazar</button></span></div>';
    }).join('') + '</div><p class="note">Acepta solo a gente que conozcas: podrá ver las cuentas y apuntar rondas.</p></section>' : '';
    var accessList = '';
    if ((store.api || store.demo) && d.access.list) {
      accessList = '<section><h2>Quién tiene acceso</h2><div class="rows">' +
        '<div class="row"><span class="grow">' + esc(me.name) + '<span class="sub">' + esc(me.email) + ' · dueño, siempre tiene acceso</span></span></div>' +
        d.access.list.filter(function (a) { return a.entry !== me.email; }).map(function (a) {
          return '<div class="row"><span class="grow">' + esc(a.name || (a.entry.charAt(0) === '@' ? 'Todo el dominio' : a.entry)) + '<span class="sub">' + esc(a.entry) + '</span></span>' +
            '<button class="btn ghost small" type="button" data-act="remove-access" data-email="' + esc(a.entry) + '"' + dis + '>Quitar</button></div>';
        }).join('') + '</div>' +
        '<div class="add-form"><input class="field" id="grant-email" type="email" placeholder="correo@gmail.com" aria-label="Correo al que dar acceso" autocomplete="off" enterkeyhint="done">' +
        '<button class="btn small" type="button" data-act="grant"' + dis + '>Dar acceso</button></div>' +
        '<p class="note">Solo tú, como dueño, ves esta lista y puedes quitar o dar acceso sin solicitud. Quien deja de tener acceso conserva sus cuentas.</p></section>';
    }
    return account + requests + accessList + install + '<section><h2>Personas</h2>' + people + '<p class="note">Quien entra con su cuenta de Google se añade solo. Aquí puedes añadir a quien no use la app. Si alguien con cuentas pendientes deja de bajar, se oculta de la ronda pero sus cuentas se conservan.</p></section>' +
      '<section><h2>Productos y precios</h2>' + products + '<p class="note">Los cambios de precio valen para las rondas nuevas. Las ya apuntadas no cambian.</p></section>' +
      '<section><h2>Dónde se guarda</h2>' + sheet + '</section>';
  }

  function renderSheet() {
    var root = $('sheet-root'), s = state.sheet;
    document.body.style.overflow = s ? 'hidden' : '';
    if (!s) { root.innerHTML = ''; root.dataset.key = ''; return; }
    var inner = '';
    if (s.type === 'picker') {
      var items = state.round.items.get(s.person) || [];
      var counts = new Map(); items.forEach(function (i) { counts.set(i.product, (counts.get(i.product) || 0) + 1); });
      var sum = items.reduce(function (t, i) { return t + i.price; }, 0);
      var rows = state.data.products.map(function (p) {
        var n = counts.get(p.name) || 0;
        return '<div class="prow' + (n ? ' sel' : '') + '"><button class="pick" data-act="pick" data-product="' + esc(p.name) + '"><span>' + esc(p.name) + '</span><span class="pp">' + money(cents(p.price)) + '</span></button>' +
          '<span class="stepper"><button data-act="dec" data-product="' + esc(p.name) + '" aria-label="Uno menos de ' + esc(p.name) + '"' + (n ? '' : ' disabled') + '>−</button>' +
          '<span class="n" aria-label="' + n + ' unidades">' + n + '</span>' +
          '<button data-act="inc" data-product="' + esc(p.name) + '" aria-label="Uno más de ' + esc(p.name) + '">+</button></span></div>';
      }).join('');
      inner = '<div class="sheet-head"><h3 id="sheet-title">' + esc(s.person) + '</h3><span class="sum">' + money(sum) + '</span></div>' +
        '<p class="hint">Toca un producto para elegirlo. Con + pide más de uno.</p>' +
        (rows ? '<div class="plist">' + rows + '</div>' : '<p class="body">No hay productos. Añádelos en Ajustes.</p>') +
        '<div class="sheet-actions">' + (items.length ? '<button class="btn danger" data-act="remove-person">Quitar de la ronda</button>' : '') +
        '<button class="btn dark" data-act="close-sheet">Listo</button></div>';
    } else if (s.type === 'confirm') {
      inner = '<div class="sheet-head"><h3 id="sheet-title">' + esc(s.title) + '</h3></div><p class="body">' + esc(s.text) + '</p>' +
        '<div class="sheet-actions"><button class="btn ghost" data-act="close-sheet">Cancelar</button>' +
        '<button class="btn" data-act="confirm-yes" style="background:var(--neg);color:#fff">' + esc(s.yes) + '</button></div>';
    }
    var key = s.type + ':' + (s.person || s.title);
    var open = root.querySelector('.sheet');
    if (open && root.dataset.key === key) { open.innerHTML = inner; return; }
    root.dataset.key = key;
    root.innerHTML = '<div class="overlay" data-act="overlay"><div class="sheet" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="sheet-title">' + inner + '</div></div>';
    root.querySelector('.sheet').focus({ preventScroll: true });
  }

  function toast(msg, action) {
    clearTimeout(state.toastTimer);
    var root = $('toast-root');
    root.innerHTML = '<div class="toast"><span>' + esc(msg) + '</span>' + (action ? '<button data-act="toast-action">' + esc(action.label) + '</button>' : '') + '</div>';
    state.toastAction = action ? action.fn : null;
    state.toastTimer = setTimeout(function () { root.innerHTML = ''; state.toastAction = null; }, action ? 7000 : 4000);
  }

  /* ---------- Acciones ---------- */
  function run(promise) {
    state.writes = (state.writes || 0) + 1;
    state.busy = true; render();
    return Promise.resolve(promise).then(function (data) {
      setData(data); return data;
    }).catch(function (err) {
      toast('No se ha podido guardar: ' + String((err && err.message) || err).replace(/\.$/, '') + '. Inténtalo otra vez.');
      return null;
    }).then(function (res) { state.busy = false; render(); return res; });
  }

  function savePeople(list, okMsg) {
    return run(store.savePeople(list.map(function (p) { return { name: p.name, active: p.active }; }))).then(function (r) { if (r && okMsg) toast(okMsg); return r; });
  }

  var actions = {
    tab: function (el) {
      state.tab = el.dataset.tab; state.sheet = null;
      if (state.tab !== 'ajustes') { state.draft = null; state.draftDirty = false; }
      render(); window.scrollTo(0, 0);
      var m = $('main'); m.classList.remove('enter'); void m.offsetWidth; m.classList.add('enter');
      if (state.tab !== 'ronda') refresh();
    },
    payer: function (el) {
      var n = el.dataset.name;
      state.round.payer = (state.round.payer === n) ? null : n;
      render();
    },
    // Tocar a alguien siempre abre la lista de productos: no se repite lo que pidió la última vez.
    person: function (el) {
      state.sheet = { type: 'picker', person: el.dataset.name }; render();
    },
    pick: function (el) {
      var p = productByName(el.dataset.product); if (!p) return;
      state.round.items.set(state.sheet.person, [{ product: p.name, price: cents(p.price) }]);
      state.sheet = null; render();
    },
    inc: function (el) {
      var p = productByName(el.dataset.product); if (!p) return;
      var list = state.round.items.get(state.sheet.person) || [];
      list.push({ product: p.name, price: cents(p.price) });
      state.round.items.set(state.sheet.person, list); render();
    },
    dec: function (el) {
      var list = state.round.items.get(state.sheet.person) || [];
      for (var i = list.length - 1; i >= 0; i--) { if (list[i].product === el.dataset.product) { list.splice(i, 1); break; } }
      if (list.length) state.round.items.set(state.sheet.person, list); else state.round.items.delete(state.sheet.person);
      render();
    },
    'remove-person': function () { state.round.items.delete(state.sheet.person); state.sheet = null; render(); },
    'close-sheet': function () { state.sheet = null; render(); },
    overlay: function (el, e) { if (e.target === el) { state.sheet = null; render(); } },
    'confirm-yes': function () { var fn = state.sheet && state.sheet.onYes; state.sheet = null; render(); if (fn) fn(); },
    'clear-round': function () { state.round = { payer: null, items: new Map() }; render(); },
    'repeat-last': function () {
      var last = state.data.rounds[state.data.rounds.length - 1]; if (!last) return;
      var names = activeNames(), skipped = 0;
      state.round = { payer: null, items: new Map() };
      last.items.forEach(function (it) {
        var p = productByName(it.product);
        if (names.indexOf(it.person) < 0 || !p) { skipped++; return; }
        var list = state.round.items.get(it.person) || [];
        list.push({ product: p.name, price: cents(p.price) });
        state.round.items.set(it.person, list);
      });
      render();
      if (skipped) toast('Algún producto o persona ya no existe y no se ha copiado.');
    },
    'save-round': function () {
      if (state.busy) return;
      var payer = currentPayer(), items = roundItems();
      if (!payer || !items.length) return;
      var total = items.reduce(function (s, i) { return s + i.price; }, 0);
      run(store.addRound({ payer: payer, items: items.map(function (i) { return { person: i.person, product: i.product, price: i.price / 100 }; }) })).then(function (d) {
        if (!d) return;
        state.round = { payer: null, items: new Map() }; render();
        var id = d.lastId;
        toast('Apuntado: ' + payer + ' ha pagado ' + money(total) + '.', id ? { label: 'Deshacer', fn: function () { run(store.deleteRound(id)).then(function (r) { if (r) toast('Ronda deshecha.'); }); } } : null);
      });
    },
    settle: function (el) {
      if (state.busy) return;
      var from = el.dataset.from, to = el.dataset.to, amount = Number(el.dataset.amount);
      run(store.addPayment({ from: from, to: to, amount: amount / 100 })).then(function (d) {
        if (!d) return;
        var id = d.lastId;
        toast('Apuntado: ' + from + ' ha devuelto ' + money(amount) + ' a ' + to + '.', id ? { label: 'Deshacer', fn: function () { run(store.deletePayment(id)); } } : null);
      });
    },
    'del-round': function (el) {
      var id = el.dataset.id;
      state.sheet = { type: 'confirm', title: '¿Borrar la ronda?', text: 'Desaparece del historial y de las cuentas de todos.', yes: 'Borrar', onYes: function () { run(store.deleteRound(id)).then(function (r) { if (r) toast('Ronda borrada.'); }); } };
      render();
    },
    'del-payment': function (el) {
      var id = el.dataset.id;
      state.sheet = { type: 'confirm', title: '¿Borrar el pago?', text: 'Las cuentas volverán a estar como antes de ese pago.', yes: 'Borrar', onYes: function () { run(store.deletePayment(id)).then(function (r) { if (r) toast('Pago borrado.'); }); } };
      render();
    },
    'hide-person': function (el) {
      var n = el.dataset.name, keep = hasHistory(n);
      var list = keep ? state.data.people.map(function (p) { return { name: p.name, active: p.name === n ? false : p.active }; })
        : state.data.people.filter(function (p) { return p.name !== n; });
      state.round.items.delete(n); if (state.round.payer === n) state.round.payer = null;
      savePeople(list, keep ? n + ' ya no sale en la ronda. Sus cuentas se conservan.' : n + ' quitado.');
    },
    'show-person': function (el) {
      var n = el.dataset.name;
      savePeople(state.data.people.map(function (p) { return { name: p.name, active: p.name === n ? true : p.active }; }), n + ' vuelve a la ronda.');
    },
    'add-product': function () {
      syncDraft(); state.draft.push({ name: '', price: '' }); state.draftDirty = true; render();
      var i = state.draft.length - 1, f = $('pn-' + i); if (f) f.focus();
    },
    'del-product': function (el) { syncDraft(); state.draft.splice(Number(el.dataset.idx), 1); state.draftDirty = true; render(); },
    'save-products': function () {
      syncDraft();
      var list = [], seen = {};
      for (var i = 0; i < state.draft.length; i++) {
        var p = state.draft[i], name = clean(p.name);
        if (!name && !clean(p.price)) continue;
        if (!name) { toast('Falta el nombre de un producto.'); return; }
        var price = parsePrice(p.price);
        if (price === null) { toast('El precio de «' + name + '» no es válido. Escríbelo así: 1,40'); return; }
        var key = name.toLocaleLowerCase('es');
        if (seen[key]) { toast('«' + name + '» está repetido.'); return; }
        seen[key] = true; list.push({ name: name, price: price });
      }
      run(store.saveProducts(list)).then(function (r) { if (r) { state.draft = null; state.draftDirty = false; render(); toast('Precios guardados.'); } });
    },
    'reset-demo': function () {
      state.sheet = { type: 'confirm', title: '¿Reiniciar la demo?', text: 'Se borra lo que hayas probado y vuelven los datos de ejemplo.', yes: 'Reiniciar', onYes: function () {
        state.round = { payer: null, items: new Map() }; state.draft = null;
        run(store.reset()).then(function () { toast('Demo reiniciada.'); });
      } };
      render();
    },
    'toast-action': function () { var fn = state.toastAction; $('toast-root').innerHTML = ''; state.toastAction = null; if (fn) fn(); }
  };

  function syncDraft() {
    if (!state.draft) return;
    document.querySelectorAll('[data-draft]').forEach(function (inp) {
      var i = Number(inp.dataset.idx); if (state.draft[i]) state.draft[i][inp.dataset.draft] = inp.value;
    });
  }

  document.addEventListener('click', function (e) {
    var el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
    var fn = actions[el.dataset.act]; if (fn) fn(el, e);
  });
  document.addEventListener('input', function (e) {
    var t = e.target; if (!t.dataset || !t.dataset.draft) return;
    var i = Number(t.dataset.idx); if (state.draft && state.draft[i]) state.draft[i][t.dataset.draft] = t.value;
    state.draftDirty = true; var b = $('save-products'); if (b) b.disabled = state.busy;
  });
  // Sin <form>: en marcos protegidos (como el de la demo) el navegador bloquea el envío de formularios.
  function addPerson() {
    var input = $('new-person');
    if (!input || state.busy) return;
    var name = clean(input.value);
    if (!name) { input.focus(); return; }
    var existing = state.data.people.find(function (p) { return sameName(p.name, name); });
    if (existing && existing.active) { toast(existing.name + ' ya está en la lista.'); return; }
    var list = existing
      ? state.data.people.map(function (p) { return { name: p.name, active: p === existing ? true : p.active }; })
      : state.data.people.concat([{ name: name, active: true }]);
    syncDraft();
    input.value = '';
    savePeople(list).then(function (r) {
      var f = $('new-person'); if (!f) return;
      if (!r) f.value = name; // si falla, se recupera lo escrito
      f.focus();
    });
  }
  actions['add-person'] = addPerson;

  /* ---------- Entrar con tu cuenta ---------- */
  function register(name) {
    name = clean(name);
    if (!name || state.busy) { var f = $('my-name'); if (f) f.focus(); return; }
    run(store.register(name)).then(function (d) {
      if (d && d.me && d.me.name) { state.tab = 'ronda'; render(); toast('¡Hola, ' + d.me.name + '! Ya estás en la ronda.'); }
    });
  }
  function rename() {
    var input = $('rename'); if (!input || state.busy) return;
    var name = clean(input.value), old = state.data.me.name;
    if (!name) { input.focus(); return; }
    if (name === old) return;
    run(store.rename(name)).then(function (d) {
      if (!d) return;
      // La ronda en curso usa nombres: se actualiza también.
      if (state.round.items.has(old)) { var its = state.round.items.get(old); state.round.items.delete(old); state.round.items.set(name, its); }
      if (state.round.payer === old) state.round.payer = name;
      render(); toast('Ahora apareces como ' + name + '.');
    });
  }
  actions.claim = function (el) { register(el.dataset.name); };
  function accessRun(promise, okMsg) {
    return run(promise).then(function (d) { if (d && okMsg) toast(okMsg); return d; });
  }
  actions['request-access'] = function () {
    var input = $('access-name'); var name = clean(input && input.value);
    if (!name) { if (input) input.focus(); return; }
    accessRun(store.requestAccess(name), 'Solicitud enviada.');
  };
  actions['check-access'] = function () {
    accessRun(store.load()).then(function (d) {
      if (d && d.me && d.me.blocked) toast('Todavía no la han aceptado.');
      else if (d) { state.tab = 'ronda'; render(); toast('¡Ya tienes acceso!'); }
    });
  };
  actions.approve = function (el) {
    var r = state.data.access.requests.find(function (x) { return x.email === el.dataset.email; });
    accessRun(store.approveAccess(el.dataset.email), (r && r.name ? r.name : el.dataset.email) + ' ya tiene acceso.');
  };
  actions.reject = function (el) {
    var mail = el.dataset.email;
    state.sheet = { type: 'confirm', title: '¿Rechazar la solicitud?', text: mail + ' no podrá entrar. Si se equivocó, puede volver a pedirlo.', yes: 'Rechazar',
      onYes: function () { accessRun(store.rejectAccess(mail), 'Solicitud rechazada.'); } };
    render();
  };
  actions['remove-access'] = function (el) {
    var mail = el.dataset.email;
    state.sheet = { type: 'confirm', title: '¿Quitar el acceso?', text: mail + ' dejará de poder entrar. Sus rondas y cuentas se conservan.', yes: 'Quitar',
      onYes: function () { accessRun(store.removeAccess(mail), 'Acceso quitado.'); } };
    render();
  };
  actions.grant = function () {
    var input = $('grant-email'); var mail = clean(input && input.value).toLowerCase();
    if (!mail) { if (input) input.focus(); return; }
    input.value = '';
    accessRun(store.approveAccess(mail), mail + ' ya tiene acceso.').then(function (d) { if (!d) { var f = $('grant-email'); if (f) f.value = mail; } });
  };
  actions.logout = function () {
    if (!store.api) return;
    store.auth.signOut();
    state.needLogin = true; state.data = null; state.sheet = null; state.tab = 'ronda';
    state.round = { payer: null, items: new Map() };
    render();
  };
  actions.install = function () {
    var p = installPrompt; if (!p) return;
    installPrompt = null;
    p.prompt();
    p.userChoice.then(function () { render(); }).catch(function () { /* cancelado */ });
  };
  actions.register = function () { register(($('my-name') || {}).value); };
  actions.rename = rename;
  actions['demo-switch'] = function () {
    state.round = { payer: null, items: new Map() };
    run(store.switchUser()).then(function () { window.scrollTo(0, 0); });
  };

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter' || e.isComposing || !e.target) return;
    var id = e.target.id;
    if (id === 'new-person') { e.preventDefault(); addPerson(); }
    else if (id === 'access-name') { e.preventDefault(); actions['request-access'](); }
    else if (id === 'grant-email') { e.preventDefault(); actions.grant(); }
    else if (id === 'my-name') { e.preventDefault(); register(e.target.value); }
    else if (id === 'rename') { e.preventDefault(); rename(); }
  });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && state.sheet) { state.sheet = null; render(); } });
  document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible') refresh(); });

  function refresh() {
    if (state.busy || !state.data || state.draftDirty) return;
    var seq = state.writes || 0;
    store.load().then(function (d) {
      // Si se guardó algo mientras cargaba, estos datos ya son viejos.
      if (state.busy || (state.writes || 0) !== seq || state.draftDirty) return;
      setData(d); render();
    }).catch(function (err) { if (err && err.code === 'login') render(); });
  }

  // Instalar como app (Android/Chrome avisa con beforeinstallprompt; iPhone se hace desde Safari).
  var installPrompt = null;
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); installPrompt = e; if (state.tab === 'ajustes') render(); });
  window.addEventListener('appinstalled', function () { installPrompt = null; toast('App instalada.'); });
  function isStandalone() { return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true; }
  function isIOS() { return /iPhone|iPad|iPod/.test(navigator.userAgent); }

  /* ---------- Arranque ---------- */
  $('today').textContent = cap(fmtDay.format(new Date()));

  function showError(title, msg) {
    $('main').innerHTML = '<div class="empty"><h3>' + esc(title) + '</h3><p>' + esc(msg) + '</p><button class="btn" type="button" data-act="reload">Reintentar</button></div>';
  }
  actions.reload = function () { location.reload(); };

  function loadAll() {
    if (!state.data) $('main').innerHTML = '<p class="loading">Cargando cafés…</p>';
    store.load().then(function (d) {
      setData(d);
      render();
    }).catch(function (err) {
      if (err && err.code === 'login') { render(); return; }
      showError('No se pudo cargar', (err && err.message) || String(err));
    });
  }

  loadConfig().then(function (cfg) {
    var api = !!(cfg && cfg.apiUrl);
    if (api && (/PEGA_AQUI/.test(cfg.apiUrl) || !cfg.googleClientId || /PEGA_AQUI/.test(cfg.googleClientId))) {
      showError('Falta configurar la app', 'Abre config.js y pega la dirección del Apps Script y el ID de cliente de Google.');
      return;
    }
    store = isSheets ? sheetsStore() : api ? apiStore(cfg) : demoStore();
    $('status').textContent = store.demo ? 'Demo' : 'Conectando…';
    if (store.api) {
      if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function () { /* sin modo app */ });
      store.auth.onSignIn(function (data) { state.needLogin = false; setData(data); render(); });
      store.auth.onError(function (err) { var m = $('login-msg'); if (m) m.textContent = err.message; });
      if (!store.auth.credentials()) { state.needLogin = true; render(); return; }
    }
    loadAll();
  });
})();
</script>
</body>
</html>
